            Operator-only and `None` by default: the effective value is written at

            the route tier (`model_mappings`), so this applies only if a route row

            leaves it unset, and then to every such route served by this provider.

            The range is fixed platform policy

            (`TOTAL_REQUEST_TIMEOUT_MIN_SECS..=TOTAL_REQUEST_TIMEOUT_MAX_SECS`); see

            [`crate::proxy::timeouts`].'
        settings: {}
        stream_idle_timeout_secs:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Provider-tier stream-idle timeout override (streaming). Operator-only

            and `None` by default; the effective value is written at the route

            tier (`model_mappings`). The range is fixed platform policy

            (`STREAM_IDLE_TIMEOUT_MIN_SECS..=STREAM_IDLE_TIMEOUT_MAX_SECS`); see

            [`crate::proxy::timeouts`].'
