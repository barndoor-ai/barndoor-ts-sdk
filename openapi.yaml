    PolicyStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - INACTIVE
      - ARCHIVED
      title: PolicyStatus
      description: 'Policy lifecycle status.


        - ``DRAFT``: authored but never enforced. Safe to build up incrementally.

        - ``ACTIVE``: enforcing on live tool calls.

        - ``INACTIVE``: previously active, now suspended. Rules are retained but not
        enforced.

        - ``ARCHIVED``: retired. Kept for audit history; not enforced and not offered
