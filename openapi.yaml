          - $ref: '#/components/schemas/ModelSource'
            description: "Where this model came from. The Add Models dialog sends\
              \ `Custom` from\nits free-text branch and `Catalog` from the picker;\
              \ those two paths\nalready differ client-side, and this is what carries\
              \ the difference\nthrough to storage.\n\n`None` means \"infer\": the\
              \ handler inherits the anchor's provenance\nwhen one exists (so a route\
              \ created on Model Routes agrees with the\nenablement it points at),\
              \ and otherwise falls back to `Catalog`. SDK\nand curl callers therefore\
              \ land on `Catalog` by default \u2014 accepted,\nsince the pill exists\
              \ to catch a typo in the UI and an API caller is\nnot its audience."
        stream_idle_timeout_secs:
