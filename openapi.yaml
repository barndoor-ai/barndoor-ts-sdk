    OperatorNone-Output:
      properties:
        none:
          $ref: '#/components/schemas/ConditionOf-Output'
          description: "Logical NOR \u2014 the rule applies only if NO matcher in\
            \ `of` evaluates true."
      type: object
      required:
      - none
      title: OperatorNone
    OrgConfigResponse:
