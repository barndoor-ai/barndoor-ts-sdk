    PricingChangeSource:
      type: string
      description: 'How a `model_pricing` version was produced. Persisted as a

        `VARCHAR(20)` constrained to one of these eight values (see

        migrations V34 + V35). Surfaced to admins as the "source" badge on

        each entry of the `PricingHistoryDialog`.'
      enum:
      - admin_create
      - admin_edit
      - admin_schedule
      - import
      - sync_manual
      - sync_auto
      - admin_archive
      - admin_restore
    PricingRuleSummary:
      allOf:
      - $ref: '#/components/schemas/AdminModelPricing'
      - type: object
        required:
        - scheduled_count
        - version_count
        properties:
          next_scheduled_effective_from:
            type:
            - string
            - 'null'
            format: date-time
            description: When the next scheduled version takes effect, if any.
          scheduled_count:
            type: integer
            format: int64
            description: 'Versions of this rule with `effective_from > now()` that
              haven''t

              activated yet. `0` means no scheduled change pending.'
          version_count:
            type: integer
            format: int64
            description: Total versions in this rule's history (including `current`).
      description: 'One entry in the per-rule list returned by `GET /admin/model-pricing`.

        `current` is the latest version with `effective_from <= now()` (so the

        row UI can render exactly as it did pre-V34), `scheduled_count` /

        `next_scheduled_effective_from` drive the small "Scheduled" affordance on

        the row, and `version_count` decides whether to show the history icon.'
    PricingSyncMode:
      type: string
      description: 'Per-row sync behavior. Stored as a `VARCHAR(16)` constrained to

        `tracking | pinned | auto` (see migration V33).'
      enum:
      - tracking
      - pinned
      - auto
    Protocol:
      type: string
      enum:
      - mcp
      - sse
      title: Protocol
      description: Protocol enum for MCP server communication.
    Provider:
      allOf:
      - $ref: '#/components/schemas/ChangeAttribution'
        description: 'Who created and last changed this provider, and why (BCP-3998).


          Absent in the resolve/route queries -- the request path never reads it

          -- and read with `try_get`, so those rows come back unattributed rather

          than failing. That is indistinguishable from a row nobody has touched

          since V75, which is the correct thing for a value the request path was

          never given.'
      - type: object
        required:
        - id
        - org_id
        - name
        - model_provider
        - auth_type
        - base_url
        - secret_path
        - enabled
        - settings
        - created_at
        - updated_at
        - health_status
        - enforce_health_check
        - model_sync_mode
        - billing_mode
        properties:
          auth_type:
            type: string
          base_url:
            type: string
          billing_mode:
            $ref: '#/components/schemas/BillingMode'
            description: 'Whether the gateway records a per-token cost for this provider''s

              traffic (V69 / BCP-3876). `PerToken` for every provider that has not

              opted in, which is the default and the back-compat value.


              The request path does **not** read this field: billing consults

              [`ai_governance::CostCalculator`]''s own cached not-metered set, which

              is refreshed from the same query as pricing. This exists for the admin

              API surface and the audit trail.'
          billing_note:
            type:
            - string
            - 'null'
            description: "Optional free-text context for the arrangement (max 200\
              \ chars).\nHuman-readable only \u2014 never parsed, never aggregated."
          billing_reason:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillingReason'
              description: "How the vendor bills this provider. Required when `billing_mode`\
                \ is\n`NotMetered`, optional otherwise (V69 CHECK-enforced) \u2014\
                \ a subscription\nbilling overages is both per-token and a subscription.\
                \ Purely\ndescriptive: no code branches on it, which is what lets\
                \ a new reason be\nadded without touching the billing path."
          catalog_id:
            type:
            - string
            - 'null'
            format: uuid
          catalog_slug:
            type:
            - string
            - 'null'
          connection_id:
            type:
            - string
            - 'null'
            format: uuid
          created_at:
            type: string
            format: date-time
          enabled:
            type: boolean
          enforce_health_check:
            type: boolean
            description: 'Operator override for the health gate (V46). When `true`
              (default)

              routing requires `health_status <> ''unhealthy''`; when `false` the
              gate

              is bypassed and the provider serves regardless of probe results (we

              still probe and surface health). Lets an admin force traffic through
              a

              false-positive probe.'
          health_checked_at:
            type:
            - string
            - 'null'
            format: date-time
            description: When the last connectivity probe ran (NULL until the first
              probe).
          health_detail:
            type:
            - string
            - 'null'
            description: Human-readable reason for the last `unhealthy` probe (NULL
              otherwise).
          health_status:
            type: string
            description: 'Observed upstream reachability, recorded separately from
              `enabled`

              (operator intent) so the system never overwrites the toggle (V45).

              One of `unverified` | `healthy` | `unhealthy`. `unverified` is the

              back-compat default and also covers provider families we don''t probe

              (Bedrock/Vertex/Azure, claude_oauth, codex_oauth). A provider serves
              traffic only

              when `enabled` AND `health_status <> ''unhealthy''`: a failed probe

              auto-suspends it from routing (see `resolve_*`) without disabling it,

              and it resumes once a probe records it healthy again.'
          id:
            type: string
            format: uuid
          model_provider:
            type: string
          model_sync_mode:
            $ref: '#/components/schemas/ModelSyncMode'
            description: 'Whether this provider tracks Barndoor''s model catalog,
              and how far

              (V63 / BCP-3811). `Off` for every provider that has not opted in,

              which is the default and the back-compat value.'
          name:
            type: string
          org_id:
            type: string
            format: uuid
          request_timeout_secs:
            type:
            - integer
            - 'null'
            format: int32
            description: 'Provider-tier total-request timeout override (non-streaming).

              Operator-only and `None` by default: the effective value is written

              at the route tier (`model_mappings`), so this only applies if a route

              row somehow leaves it unset. Range

              `TOTAL_REQUEST_TIMEOUT_MIN_SECS..=TOTAL_REQUEST_TIMEOUT_MAX_SECS` is

              enforced by the CHECK constraint (see `proxy::timeouts`).'
          secret_path:
            type: string
          settings: {}
          stream_idle_timeout_secs:
            type:
            - integer
            - 'null'
            format: int32
            description: 'Provider-tier stream-idle timeout override (streaming).
              Operator-only

              and `None` by default; the effective value is written at the route

              tier (`model_mappings`). Range

              `STREAM_IDLE_TIMEOUT_MIN_SECS..=STREAM_IDLE_TIMEOUT_MAX_SECS` is

              enforced by the CHECK constraint (see `proxy::timeouts`).'
          updated_at:
            type: string
            format: date-time
