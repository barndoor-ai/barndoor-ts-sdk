        principal_arn:
          type: string
          description: Barndoor's principal ARN, to trust in the customer's role.
    DlpErrorResponse:
      type: object
      description: "The error body every `/admin/v1` handler returns.\n\nTwo shapes\
        \ reach the wire and both are modelled here as optional fields:\nthe shared\
        \ auth/role gate in [`super`] emits `{\"error\": ...}`, while\n[`super::json_message`]\
        \ \u2014 which the handlers themselves use \u2014 emits\n`{\"message\": ...}`.\
        \ Exactly one is present on any given response. This is\ndocumentation of\
        \ what the service already does, not a new contract; a\nhandler is not free\
        \ to send both."
      properties:
        error:
          type:
          - string
          - 'null'
          description: Set by the authentication and tenant-admin role gate (401 and
            403).
        message:
          type:
          - string
          - 'null'
          description: Set by handler-level validation and store failures.
    EffectivePricing:
      type: object
      description: "The rate a request against a given mapping would be billed at,\
        \ plus which\ntier produced it.\n\n`source` is always present. Every other\
        \ field is `None` when\n`source == \"none\"` \u2014 meaning no rule and no\
        \ Barndoor default covers this\nmodel, so requests succeed but record $0.\
        \ The rates are deliberately\nnullable rather than zero-filled: a UI that\
        \ renders `$0.00` for an\nunpriced model reads as \"this model is free\",\
        \ which is exactly the wrong\nconclusion.\n\nClients distinguish four states:\n\
        \n* field absent entirely \u2192 backend predates this annotation\n* `source\
        \ == \"none\"` \u2192 unpriced, bills at $0 because the rate is *unknown*\n\
        * `source == \"not_metered\"` \u2192 bills at $0 *by decision* (BCP-3876):\
        \ the\n  provider's `billing_mode` is `subscription`, so no rate is consulted.\n\
        \  Rates are `None` here too, but for the opposite reason, and the UI must\n\
        \  not lump it in with \"unpriced\" \u2014 that bucket is a misconfiguration\
        \ it\n  nags about and offers to bulk-disable.\n* anything else \u2192 priced,\
        \ `input`/`output` populated"
      required:
      - source
      properties:
        cache_read_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
          description: "Prompt-cache read rate. `None` on a *priced* row means the\
            \ rule sets\nno explicit cache rate, and the calculator bills cached input\
            \ at the\nbase input rate \u2014 render it as an inherited default, never\
            \ as free."
        cache_write_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
          description: Prompt-cache write rate. Same `None` semantics as the read
            rate.
        input_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
        long_context:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LongContextTier'
            description: 'The long-context surcharge on the matched rule (BCP-3904),
              when it

              has one.


              Present here for the same reason the rates are: an admin ordering

              route priorities on cost has to be able to see that a target''s price

              doubles above a prompt-size threshold. Rendering only the

              short-context rate for a Grok or GPT-6 route would understate its

              cost on exactly the long-context traffic that makes the choice

              matter.'
        output_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
        pricing_rule_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The `model_pricing` version row that matched, so the UI can
            link a

            displayed rate back to the rule that produced it. `None` when

            `source == "none"`.'
        source:
          type: string
          description: 'Which resolution tier matched: `org_instance`, `org_catalog`,

            `org_generic`, `barndoor_default`, or `none`. Mirrors

            [`PricingSource::as_str`] so the value matches what audit events

            already record for the same decision.'
