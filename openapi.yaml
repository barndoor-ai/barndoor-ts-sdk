        These are the names a policy rule addresses through ``roles_groups``. The

        values here are UNPREFIXED; a policy rule requires the ``role:``/``group:``

        prefix (see ``PolicyRule.roles_groups`` in policy-service), so a value

        ``Engineering`` from ``groups`` is written as ``group:Engineering``.'
    PaginatedResponse_AllowListEntryResponse:
      type: object
