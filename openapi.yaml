            - $ref: '#/components/schemas/BudgetTargetStatus'
              description: 'Populated when a `LlmProvider` / `Model` / `ModelAlias`
                budget with

                `action_on_exhaust = block` is currently exhausted for the

                mapping''s `(provider_id, upstream_model, model_alias)` triple.

                Runtime would drop this route from the resolved plan; the pill

                surfaces the same state without filtering the row out of the

                listing.'
          effective_pricing:
            $ref: '#/components/schemas/EffectivePricing'
            description: 'The rate a request against this mapping would be billed
              at, resolved

              through the same tier chain the cost calculator uses (BCP-3564).

              Always present; `source == "none"` means unpriced. See

              [`crate::effective_pricing`].'
          route_health_status:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/RouteHealthStatus'
              description: 'Populated when the mapping''s `(provider_id, upstream_model)`
                route is

                in a passive-health cooldown. The page renders a "temporarily

                unavailable" pill; the row stays in the listing.'
          stale_status:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ModelStaleStatus'
              description: "Populated when the model is enabled from a provider catalog\
                \ that no\nlonger lists it (BCP-3812). Advisory: nothing is disabled\
                \ on the\nstrength of it \u2014 retirement is BCP-3811's `full` mode,\
                \ which the org\nopts into. See [`crate::catalog_status`]."
      description: "Wraps a [`ModelMapping`] with the BCP-2813 `budget_status` annotation\
        \ so\nthe admin Model Mappings page can render a \"disabled by budget\" pill.\n\
        The inner `ModelMapping` fields are flattened so the response is a\ndrop-in\
        \ superset of the legacy `Vec<ModelMapping>` shape \u2014 older clients\n\
        that ignore `budget_status` keep working unchanged."
    ModelMappingWithProvider:
      allOf:
      - $ref: '#/components/schemas/ChangeAttribution'
        description: See [`ModelMapping::attribution`].
      - type: object
        required:
        - id
        - provider_id
        - provider_name
        - provider_auth_type
        - model_alias
        - upstream_model
        - enabled
        - priority
        - retry_on_429_count
        - retry_on_429_max_wait_secs
        - bare_alias
        - created_at
        - source
        properties:
          auto_disabled_reason:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AutoDisabledReason'
              description: See [`ModelMapping::auto_disabled_reason`].
          bare_alias:
            type: boolean
          created_at:
            type: string
            format: date-time
            description: "When this mapping was created. Rows predating the column\
              \ are\nbackfilled from the owning provider \u2014 see migration V58."
          enabled:
            type: boolean
          id:
            type: string
            format: uuid
          model_alias:
            type: string
          priority:
            type: integer
            format: int32
          provider_auth_type:
            type: string
          provider_id:
            type: string
            format: uuid
          provider_name:
            type: string
          request_timeout_secs:
            type:
            - integer
            - 'null'
            format: int32
          retry_on_429_count:
            type: integer
            format: int32
          retry_on_429_max_wait_secs:
            type: integer
            format: int32
          source:
            $ref: '#/components/schemas/ModelSource'
            description: See [`ModelMapping::source`].
          stream_idle_timeout_secs:
            type:
            - integer
            - 'null'
            format: int32
          upstream_model:
            type: string
    ModelMappingWithProviderAndBudgetStatus:
      allOf:
      - $ref: '#/components/schemas/ModelMappingWithProvider'
      - type: object
        required:
        - effective_pricing
        properties:
          budget_status:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BudgetTargetStatus'
          effective_pricing:
            $ref: '#/components/schemas/EffectivePricing'
