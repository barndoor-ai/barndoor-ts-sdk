    post:
      tags:
      - policy
      summary: Create Policy
      description: "Create a policy governing exactly one MCP server.\n\nA rule grants\
        \ its `actions` to its `roles_groups`. Access is denied by default, so a\n\
        tool no rule grants is already blocked \u2014 `authorized: false` is only\
        \ for carving an\nexception out of a broader allow.\n\nWrite ONE rule per\
        \ `roles_groups` set \u2014 all of a principal's actions on one rule,\nwith\
        \ `:approve` carrying allow-vs-confirm. Example, reads free and writes confirmed:\n\
        \n    {\"name\": \"Support tooling\", \"mcp_server_id\": \"3f7c\u2026\", \"\
        rules\": [\n      {\"name\": \"Support issue access\", \"authorized\": true,\
        \ \"active\": true,\n       \"actions\": [\"tools/call:list_issues\", \"tools/call:create_issue:approve\"\
        ],\n       \"roles_groups\": [\"group:Support\"]}]}\n\nOne policy per (server,\
        \ agent scope): a second ACTIVE policy over the same\n`mcp_server_id` and\
        \ `application_ids` is refused with 409 naming the holder. Add rules\nto the\
        \ existing policy instead, or scope the new one to specific `application_ids`.\n\
        `validate_policy` reports this before you write."
      operationId: create_policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicy'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
