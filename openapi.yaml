    MaskFormat:
      type: object
      description: 'The `mask_format` object stored on `dlp.enforcement_policies.mask_format`

        and carried on the admin REST surface. `deny_unknown_fields` so a typo in
        a

        client (or a future key an older server does not understand) fails loudly.'
