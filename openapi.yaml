    PolicyRule-Input:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: "Optional display name for the rule. Letters, digits, spaces,\
            \ hyphens and underscores only \u2014 a colon or other punctuation is\
            \ rejected with a 422, which is easy to hit because rule names tend to\
            \ read like `Security: view agents`. Names must also be unique within\
            \ the policy once punctuation is normalized, so `My Rule` and `My-Rule`\
            \ collide."
          default: ''
          examples:
          - Engineering read access
          - Support write with approval
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Optional human-readable description for the rule; has no effect
            on enforcement
        authorized:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Authorized
          description: "Effect of the rule: True grants the listed `actions`, False\
            \ denies them. Access is denied by default, so a tool that no rule grants\
            \ is already blocked \u2014 an explicit False rule is only needed to carve\
            \ an exception out of a broader allow. The effective model is tri-state\
            \ rather than binary: Always Allow is True on the plain action, Needs\
            \ Approval is True on the `:approve` twin (see `actions`), and Blocked\
            \ is simply the absence of a grant."
          default: false
        active:
          type: boolean
          title: Active
          description: "Whether this rule is enforced. False keeps the rule on the\
            \ policy but omits it from enforcement \u2014 use it to disable a rule\
            \ without deleting it."
          default: true
        actions:
          items:
            type: string
          type: array
          title: Actions
          description: "Tool actions this rule matches, in the wire format `tools/call:<tool_name>`\
            \ \u2014 for example `tools/call:create_issue`. Use `*` to match every\
            \ action on the server. Tool names are specific to the target MCP server:\
            \ enumerate the server's real tools rather than guessing names. A trailing\
            \ `:approve` selects the Needs-Approval variant of a tool (`tools/call:create_issue:approve`),\
            \ which requires per-call human confirmation; the plain action is Always\
            \ Allow. Do not grant both twins of the same tool in one rule."
          examples:
          - - tools/call:create_issue
          - - tools/call:delete_page:approve
          - - '*'
        roles_groups:
          items:
            type: string
          type: array
          title: Roles Groups
          description: "Principals this rule applies to, as PREFIXED entries: `role:<role_name>`\
            \ for an IdP/Keycloak role, `group:<group_name>` for a user group, or\
            \ the literal `*` for all users (the default). A bare name with no `role:`/`group:`\
            \ prefix matches NOTHING. Retrieve the organization's real role and group\
            \ names from `GET /api/identity/public/v1/users/roles-groups`. A principal\
            \ set should appear on at most ONE rule in a policy \u2014 collect all\
            \ of its actions there instead of spreading them over several rules."
          examples:
          - - '*'
          - - group:Engineering
          - - role:admin
            - group:Platform
        condition:
          anyOf:
          - $ref: '#/components/schemas/PolicyRuleCondition-Input'
          - type: 'null'
          description: 'Optional CEL condition; the rule applies only when it evaluates
            true. Shape is `{"match": <matcher>}`. Omit entirely for an unconditional
            rule.'
      type: object
      required:
      - actions
      title: PolicyRule
      description: 'A single rule: which principals may take which tool actions, optionally
        conditioned.'
