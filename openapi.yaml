    Posture:
      type: string
      description: "Which way a policy leans when the router is genuinely unsure.\n\
        \nPassed to the router as an instruction, not as a separate code path \u2014\
        \ there\nis one picker, and posture only shifts how it resolves uncertainty.\
        \ It never\noverrides a rule floor, a rule ban, or the caller's model access;\
        \ those are\napplied in code afterwards."
      enum:
      - savings
      - balanced
      - quality
    PresidioConnectionResponse:
      type: object
