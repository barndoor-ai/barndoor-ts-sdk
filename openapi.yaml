                $ref: '#/components/schemas/PaginationResponse_PolicyImpactSummary_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/policy/v2/policy-impacts/summary:
    get:
      tags:
      - policy
      summary: Get Policy Impacts Summary
      description: 'Badge counts: ``{policy_id: {breaking, review, info}}``, archived
        excluded.'
      operationId: get_policy_impacts_summary
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/PolicyImpactSeverityCounts'
                type: object
                title: Response Get Policy Impacts Summary
  /api/policy/v2/policy-impacts/summary/by-kind:
    get:
      tags:
      - policy
      summary: Get Policy Impacts Summary By Kind
      description: "Rollup line counts: ``{policy_id: {change_kind: live_count}}``,\
        \ archived excluded.\n\nSibling of ``/policy-impacts/summary`` grouped by\
        \ ``change_kind`` instead of\nseverity \u2014 kept as a separate route rather\
        \ than a widened ``/summary``\nresponse because ``PolicyImpactSeverityCounts``\
        \ uses ``extra=\"allow\"`` to\nsurface unrecognised severities, and a structural\
        \ ``kinds`` key there would\nbe indistinguishable from one. ``change_kind``\
        \ is tool-router's open\nvocabulary, so kinds are not zero-filled: only kinds\
        \ with live rows appear."
      operationId: get_policy_impacts_summary_by_kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  additionalProperties:
                    type: integer
                  type: object
                type: object
                title: Response Get Policy Impacts Summary By Kind
  /api/policy/v2/policies/{policy_id}/impacts:
    get:
      tags:
      - policy
      summary: List Impacts For Policy
      description: "Every impact on one policy, newest first \u2014 the policy detail\
        \ view's list.\n\nUnlike the org-wide list, resolved rows are NOT excluded\
        \ by default: this\nis the history view, with resolved rows collapsed client-side.\
        \ Archived\npolicies are still excluded (:class:`PolicyImpactService`'s\n\
        ``_base_query`` backs both this and the org-wide list identically) \u2014\n\
        an archived policy's detail page must not surface flags the org view\nis hiding.\n\
        \n**Capped, and the cap is not an error.** At most\n:data:`~policy_service.services.policy_impact.PER_POLICY_LIST_CAP`\
        \ rows are\nreturned, newest first. Resolved impacts are kept indefinitely\
        \ as an audit\ntrail and each carries a non-trivial ``detail`` blob, so an\
        \ uncapped response\nwould grow without limit. Truncation is therefore possible\
        \ and is NOT\nsignalled \u2014 this is a detail view where the newest rows\
        \ are what matter. For\nfull history, page the org-wide ``GET /policy-impacts?policy_id=``\
        \ instead."
      operationId: list_policy_impacts
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Policy Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Filter by status. Unset: every status (history view).'
          title: Status
        description: 'Filter by status. Unset: every status (history view).'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyImpactSummary'
                title: Response List Policy Impacts
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/policy/v2/policies/{policy_id}/impacts/{impact_id}/acknowledge:
    post:
      tags:
      - policy
      summary: Acknowledge Policy Impact
      description: '``open`` -> ``acknowledged``.


        404 if the impact doesn''t exist (or belongs to another org/policy); 409 if

        it isn''t ``open``. **Both** ``policy_id`` and ``impact_id`` are typed as

        UUIDs, so a malformed id in the URL 422s here rather than reaching the

        query and raising an unhandled ``asyncpg.DataError`` (=> 500) against a

        UUID column. This is deliberately stricter than ``admin_v2``''s

        plain-``str`` path-param convention.'
      operationId: acknowledge_policy_impact
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Policy Id
      - name: impact_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Impact Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyImpactSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/identity/public/v1/users/roles-groups:
    get:
      tags:
      - identity
      summary: Get Organization Roles Groups
      description: 'Get all unique roles and groups across all users in the organization.


        Returns aggregated lists of all roles and groups that are assigned

        to any user in the authenticated user''s organization.

        Only users with permission to list users can access this endpoint.'
      operationId: list_roles_and_groups
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRolesGroupsResponse'
  /api/identity/public/v1/idp/connection:
    get:
      tags:
      - identity
      summary: Get Idp Connection
      description: 'Get the current IdP connection configuration for the organization.


        Returns the current OIDC configuration including endpoints and

        whether client credentials are configured (credentials are not exposed).


        Only admins can view this configuration.'
      operationId: get_idp_connection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpConnectionResponse'
    put:
      tags:
      - identity
      summary: Update Idp Connection
      description: 'Update the IdP connection configuration for the organization.


        Updates the OIDC Identity Provider settings including:

        - Display name

        - OIDC endpoints (authorization, token, userinfo, JWKS, logout)

        - Client credentials

        - Scopes

        - The OIDC `prompt` sent on the authorization request


        Only admins can update this configuration.

        Changes take effect immediately for new login attempts.'
      operationId: update_idp_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdpConnectionConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpConnectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - identity
      summary: Create Idp Connection
      description: 'Create a new IdP connection for the organization.


        Creates a new OIDC Identity Provider and links it to the organization.

        This enables SSO for the organization.


        Required fields:

        - display_name: Human-readable name for the IdP

        - issuer: OIDC issuer URL

        - client_id: OAuth client ID from your IdP

        - client_secret: OAuth client secret from your IdP

        - authorization_url: OIDC authorization endpoint

        - token_url: OIDC token endpoint

        - jwks_url: OIDC JWKS endpoint


        Only admins can create an IdP connection.

        Returns 409 if an IdP already exists for this organization.'
      operationId: create_idp_connection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdpConnectionConfig'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpConnectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - identity
      summary: Delete Idp Connection
      description: 'Delete the IdP connection for the organization.


        This removes the Identity Provider, disabling SSO for the organization.

        Users will need to use alternative authentication methods.


        WARNING: This action cannot be undone. Existing user sessions may be affected.


        Only admins can delete the IdP connection.'
      operationId: delete_idp_connection
      responses:
        '204':
          description: Successful Response
  /api/identity/public/v1/idp/config:
    get:
      tags:
      - identity
      summary: Get Idp Config
      description: 'Get the current IdP role mapping configuration for the organization.


        ``admin_group`` is read from the org''s ``admin``-role ``group_role_mapping``
        row

        (BCP-3486); ``idp_alias``/``idp_display_name`` still come from Keycloak.

        Requires admin or superadmin role.'
      operationId: get_idp_config
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpRoleMappingResponse'
    put:
      tags:
      - identity
      summary: Update Idp Config
      description: "Update the IdP role mapping configuration for the organization.\n\
        \nRequires an IdP to already be configured for the organization \u2014 raises\
        \ 404\notherwise, matching the legacy Keycloak-mapper-backed behavior (strict\
        \ backward\ncompatibility). Upserts (or, when ``admin_group`` is empty, deletes)\
        \ the org's\n``admin``-role ``group_role_mapping`` row(s) (BCP-3486) and enqueues\
        \ org-wide\nre-evaluation. This no longer creates/updates a Keycloak IdP mapper\
        \ \u2014 but does\nbest-effort delete a lingering legacy ``barndoor-role-admin``\
        \ mapper if one is still\npresent, so a stale FORCE-sync mapper can't keep\
        \ granting admin at SSO after this\ncall changes the authoritative DB row\
        \ (see\n``GroupRoleMappingService.update_legacy_idp_config``).\n\nRequires\
        \ admin or superadmin role."
      operationId: update_idp_config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdpRoleMappingConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpRoleMappingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/identity/public/v1/idp/settings:
    get:
      tags:
      - identity
      summary: Get Idp Settings
      description: 'Get IdP-related settings for the organization.


        Returns settings including:

        - enforce_sso: Whether SSO is enforced (password login disabled)

        - break_glass_email: Dedicated emergency admin alias for SSO bypass


        Requires admin or superadmin role.'
      operationId: get_idp_settings
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpSettingsResponse'
  /api/identity/public/v1/idp/test:
    post:
      tags:
      - identity
      summary: Test Idp Connection
      description: 'Test the IdP connection for the organization.


        Validates that the current IdP configuration is correct by:

        1. Checking required configuration is present

        2. Verifying the OIDC discovery endpoint is reachable

        3. Validating the JWKS endpoint returns keys


        This helps diagnose configuration issues before users try to log in.

        Only admins can run this test.'
      operationId: test_idp_connection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpTestResult'
  /api/notification/public/v1/channels/options:
    get:
      tags:
      - notification
      summary: List the subscribable alert vocabulary
      description: "Returns every alert type this organization may subscribe a channel\
        \ to, plus the category and severity label vocabularies those types reference.\n\
        \nRead this before building a subscription set. The alert-type enum grows\
        \ over time and is gated per organization, so this endpoint \u2014 not a hardcoded\
        \ list \u2014 is the authoritative answer to what `subscriptions[].alert_type`\
        \ accepts. Subscribing to a type absent here is accepted but never delivers."
      operationId: list_alert_channel_options
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelOptionsResponse'
        '401':
          description: Missing, malformed, or expired bearer token.
        '403':
          description: Authenticated, but not permitted to manage this channel.
  /api/notification/public/v1/channels:
    get:
      tags:
      - notification
      summary: List the organization's shared channels
      description: "Returns the organization's org-wide channels \u2014 `email`, `webhook`,\
        \ `slack`, `teams` \u2014 with their current subscription sets. Personal channels\
        \ are not included here; read those from `/channels/user`. Unpaginated. Secrets\
        \ are never returned: a webhook's signing secret and a Teams workflow URL\
        \ surface only as the `has_signing_secret` / `has_workflow_url` flags."
      operationId: list_alert_channels
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListResponse'
        '401':
          description: Missing, malformed, or expired bearer token.
        '403':
          description: Authenticated, but not permitted to manage this channel.
    put:
      tags:
      - notification
      summary: Create or update a notification channel
      description: "Upserts one channel and **replaces** its subscription set.\n\n\
        Without `id`, the channel is keyed on its type's natural identity, so an identical\
        \ call is idempotent rather than duplicating: `email` by address, `webhook`\
        \ by URL, `slack` by channel id, personal types by (organization, type, caller).\
        \ With `id` it is an authoritative edit of that row \u2014 the only way to\
        \ update a `teams` channel, whose natural identity is a secret URL.\n\n`subscriptions`\
        \ is replaced wholesale, not merged: send the complete desired set, and expect\
        \ an omitted list to unsubscribe the channel from everything.\n\nCreating\
        \ a `webhook` channel reveals its signing secret in `signing_secret` ONCE;\
        \ it is not readable afterwards. The secret is only generated when the row\
        \ is new, so a retried create that lands after the first succeeded returns\
        \ `signing_secret: null`. If you need a secret and got `null`, call `POST\
        \ /channels/{channel_id}/regenerate-secret`."
      operationId: upsert_alert_channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelUpsertRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelResponse'
        '401':
          description: Missing, malformed, or expired bearer token.
        '403':
          description: Authenticated, but not permitted to manage this channel.
        '404':
          description: '`id` was supplied but names no channel in the caller''s organization.'
        '422':
          description: "The body violates the rules for its `type` \u2014 a missing\
            \ or forbidden destination field, a duplicated `alert_type`, or a webhook/Teams\
            \ URL rejected as non-`https` or resolving to a private address. The `detail`\
            \ names the reason."
  /api/notification/public/v1/channels/user:
    get:
      tags:
      - notification
      summary: List the caller's personal channels
      description: "Returns the authenticated caller's own `in_app` and `user_email`\
        \ channels. Always self-scoped \u2014 there is no way to read another user's\
        \ personal channels, and no user parameter to pass."
      operationId: get_my_alert_channel
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListResponse'
        '401':
          description: Missing, malformed, or expired bearer token.
        '403':
          description: Authenticated, but not permitted to manage this channel.
  /api/notification/public/v1/channels/{channel_id}:
    delete:
      tags:
      - notification
      summary: Delete a channel
      description: "Deletes one channel; its subscriptions cascade and any stored\
        \ secret is removed. Irreversible \u2014 to stop delivery reversibly, upsert\
        \ the channel with `enabled: false` instead."
      operationId: delete_alert_channel
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Channel Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing, malformed, or expired bearer token.
        '403':
          description: Authenticated, but not permitted to manage this channel.
        '404':
          description: No such channel in the caller's organization.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notification/public/v1/channels/{channel_id}/regenerate-secret:
    post:
      tags:
      - notification
      summary: Rotate a webhook channel's signing secret
      description: Generates a new Standard Webhooks signing secret for a `webhook`
        channel and returns it once, in this response. The previous secret stops verifying
        immediately, so deploy the new one to your receiver before the next alert
        fires. Use this if the secret from channel creation was lost or needs rotating;
        there is no endpoint that reads the current secret.
      operationId: regenerate_alert_channel_secret
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Channel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecretResponse'
        '401':
          description: Missing, malformed, or expired bearer token.
        '403':
          description: Authenticated, but not permitted to manage this channel.
        '404':
          description: No such channel in the caller's organization.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notification/public/v1/channels/{channel_id}/test:
    post:
      tags:
      - notification
      summary: Send a test message through a channel
      description: "Sends a stock connectivity-test message through the channel's\
        \ real transport, so you can verify a webhook receiver, email address, Slack\
        \ channel, or Teams workflow actually works. It is not an alert: nothing is\
        \ persisted, no other channel is notified, and it does not depend on the channel's\
        \ subscriptions.\n\nA transport failure is reported as `200` with `ok: false`\
        \ and an `error` string \u2014 the request succeeded, the delivery did not."
      operationId: test_alert_channel
      parameters:
      - name: channel_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Channel Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelTestResponse'
        '401':
          description: Missing, malformed, or expired bearer token.
        '403':
          description: Authenticated, but not permitted to manage this channel.
        '404':
          description: No such channel in the caller's organization.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
