        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - policy
      summary: Update Policy
      description: "Update a policy. Sending `rules` REPLACES the entire rule list.\n\
        \nThere is no \"add a rule\" operation. To add one, read the policy first\
        \ and send\nevery existing rule back alongside the new one \u2014 sending\
        \ only the new rule\ndeletes the others, and the call still returns 200 with\
        \ a policy that looks\nperfectly healthy. Omit `rules` entirely to change\
        \ only metadata.\n\nVerify afterwards rather than assuming: `GET /v2/policies/{policy_id}/revisions`\n\
        lists what each change actually did, and `compare_policy_revisions` diffs\
        \ two of\nthem. A revision summarising removals you did not intend is how\
        \ you catch a\npartial send \u2014 and it is also how you recover, since the\
        \ diff records what was\ntaken out.\n\nOther fields are a partial update:\
        \ omitted ones are left alone. `mcp_server_id`\nis immutable \u2014 rules\
        \ reference server-specific tool actions, so retargeting is a\nnew policy,\
        \ not an edit."
      operationId: update_policy
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicy'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDetailResponse'
        '422':
          description: Validation Error
