openapi: 3.1.0
info:
  title: Barndoor.ai Public API
  description: Unified public API specification for Barndoor.ai platform
  version: 2.0.0
paths:
  /api/registry/v1/servers:
    get:
      tags:
      - registry
      summary: Get Mcp Servers
      operationId: list_mcp_servers
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search servers by name, slug, or source
          title: Search
        description: Search servers by name, slug, or source
      - name: availability_status
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: "Filter by availability status. With the publishing flag on\
            \ (BCP-3039), True means the state an admin listing renders as Available\
            \ \u2014 published AND still operationally sound \u2014 and False is every\
            \ other state (Pending Publish, Connection Error, Pending Credentials,\
            \ Pending Connection). Publishing itself is one-way: a published server\
            \ that later degrades answers False here but stays published, so audience_scoped\
            \ listings still consider it."
          title: Availability Status
        description: "Filter by availability status. With the publishing flag on (BCP-3039),\
          \ True means the state an admin listing renders as Available \u2014 published\
          \ AND still operationally sound \u2014 and False is every other state (Pending\
          \ Publish, Connection Error, Pending Credentials, Pending Connection). Publishing\
          \ itself is one-way: a published server that later degrades answers False\
          \ here but stays published, so audience_scoped listings still consider it."
      - name: order_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: "Order by field: name, created_at, or attention (default: name).\
            \ attention (BCP-3664) sorts attention-needing servers first \u2014 Pending\
            \ Publish, Connection Error, Pending Credentials, Pending Connection,\
            \ then Available \u2014 tie-broken by name ASC, then id ASC (the id term\
            \ is what makes the order total, so paging is deterministic); `order`\
            \ is ignored for this field. The rank is computed in SQL from DB-derived\
            \ state, so it can disagree with the Bao-recomputed `can_manage_policies`\
            \ the legacy (non-DB-first) listing path returns. Unrecognized values\
            \ fall back to created_at rather than erroring \u2014 this parameter is\
            \ under the public API stability contract, so the advertised enum narrows\
            \ generated clients without tightening server-side validation."
          enum:
          - name
          - created_at
          - attention
          default: name
          title: Order By
        description: "Order by field: name, created_at, or attention (default: name).\
          \ attention (BCP-3664) sorts attention-needing servers first \u2014 Pending\
          \ Publish, Connection Error, Pending Credentials, Pending Connection, then\
          \ Available \u2014 tie-broken by name ASC, then id ASC (the id term is what\
          \ makes the order total, so paging is deterministic); `order` is ignored\
          \ for this field. The rank is computed in SQL from DB-derived state, so\
          \ it can disagree with the Bao-recomputed `can_manage_policies` the legacy\
          \ (non-DB-first) listing path returns. Unrecognized values fall back to\
          \ created_at rather than erroring \u2014 this parameter is under the public\
          \ API stability contract, so the advertised enum narrows generated clients\
          \ without tightening server-side validation."
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Order direction: asc or desc (default: asc)'
          default: asc
          title: Order
        description: 'Order direction: asc or desc (default: asc)'
      - name: include_service_accounts
        in: query
        required: false
        schema:
          type: boolean
          description: Include service account connections for can_manage_policies
            computation (does not affect connection_status)
          default: false
          title: Include Service Accounts
        description: Include service account connections for can_manage_policies computation
          (does not affect connection_status)
      - name: include_connection_status
        in: query
        required: false
        schema:
          type: boolean
          description: Include connection_status computation (requires Bao calls).
            Set to false for better performance when connection_status is not needed.
          default: true
          title: Include Connection Status
        description: Include connection_status computation (requires Bao calls). Set
          to false for better performance when connection_status is not needed.
      - name: audience_scoped
        in: query
        required: false
        schema:
          type: boolean
          description: "BCP-3661: restrict the listing to servers this user may discover\
            \ \u2014 published AND named by an active allow rule on one of the server's\
            \ ACTIVE policies. Opt-in, because this same endpoint serves admin surfaces\
            \ (policy authoring, connector pickers) that must keep seeing every server;\
            \ filtering those would make a new server impossible to write its first\
            \ policy for. Set it on end-user surfaces (My Apps) only. NOT gated by\
            \ the mcp-server-publishing flag \u2014 an explicit request is always\
            \ honoured (a flag-eval outage must not silently serve the unfiltered\
            \ listing); the rollout gate is whether a surface sends the parameter\
            \ at all (BCP-3735). Fails closed with HTTP 503 when the visible set cannot\
            \ be resolved."
          default: false
          title: Audience Scoped
        description: "BCP-3661: restrict the listing to servers this user may discover\
          \ \u2014 published AND named by an active allow rule on one of the server's\
          \ ACTIVE policies. Opt-in, because this same endpoint serves admin surfaces\
          \ (policy authoring, connector pickers) that must keep seeing every server;\
          \ filtering those would make a new server impossible to write its first\
          \ policy for. Set it on end-user surfaces (My Apps) only. NOT gated by the\
          \ mcp-server-publishing flag \u2014 an explicit request is always honoured\
          \ (a flag-eval outage must not silently serve the unfiltered listing); the\
          \ rollout gate is whether a surface sends the parameter at all (BCP-3735).\
          \ Fails closed with HTTP 503 when the visible set cannot be resolved."
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-based)
          default: 1
          title: Page
        description: Page number (1-based)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of items per page (max 100)
          default: 10
          title: Limit
        description: Number of items per page (max 100)
      - name: connection_status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: string
          - type: 'null'
          description: 'Filter by connection status: connected, available, pending,
            error, not_connected. For multiple values, repeat the parameter (e.g.,
            ?connection_status=connected&connection_status=available). ''not_connected''
            expands to [''pending'', ''error'', ''available''].'
          title: Connection Status
        description: 'Filter by connection status: connected, available, pending,
          error, not_connected. For multiple values, repeat the parameter (e.g., ?connection_status=connected&connection_status=available).
          ''not_connected'' expands to [''pending'', ''error'', ''available''].'
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 'Filter by server status: pending, active, error. For multiple
            values, repeat the parameter (e.g., ?status=active&status=error)'
          title: Status
        description: 'Filter by server status: pending, active, error. For multiple
          values, repeat the parameter (e.g., ?status=active&status=error)'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResponse_ServerListResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/registry/v1/servers/active-ids:
    get:
      tags:
      - registry
      summary: Get Active Server Ids
      description: 'Return org-scoped server IDs in a single uncapped response (BCP-2766).


        Backs active-set lookups (audit-history deleted tagging, dashboard denominator)

        that previously paginated/capped GET /servers at 100 items per page.'
      operationId: list_active_mcp_server_ids
      parameters:
      - name: availability_status
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: "When omitted, returns all alive (non-soft-deleted) server\
            \ IDs for the org. True returns only available servers (with the publishing\
            \ flag on \u2014 BCP-3039 \u2014 published AND still operationally sound;\
            \ else operationally available); False returns the complement. Uncapped\
            \ \u2014 no pagination."
          title: Availability Status
        description: "When omitted, returns all alive (non-soft-deleted) server IDs\
          \ for the org. True returns only available servers (with the publishing\
          \ flag on \u2014 BCP-3039 \u2014 published AND still operationally sound;\
          \ else operationally available); False returns the complement. Uncapped\
          \ \u2014 no pagination."
      - name: audience_scoped
        in: query
        required: false
        schema:
          type: boolean
          description: "BCP-3735: restrict the returned IDs to servers this user may\
            \ discover \u2014 published AND named by an active allow rule on one of\
            \ the server's ACTIVE policies (same semantics as GET /servers?audience_scoped=true).\
            \ Opt-in: the default keeps existing callers (audit-history deleted tagging,\
            \ dashboard denominators) seeing every server. Fails closed with HTTP\
            \ 503 when the visible set cannot be resolved."
          default: false
          title: Audience Scoped
        description: "BCP-3735: restrict the returned IDs to servers this user may\
          \ discover \u2014 published AND named by an active allow rule on one of\
          \ the server's ACTIVE policies (same semantics as GET /servers?audience_scoped=true).\
          \ Opt-in: the default keeps existing callers (audit-history deleted tagging,\
          \ dashboard denominators) seeing every server. Fails closed with HTTP 503\
          \ when the visible set cannot be resolved."
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/registry/v1/servers/{server_id}:
    get:
      tags:
      - registry
      summary: Get Mcp Server
      description: "Return details for an individual MCP server including connection\
        \ status and base URL.\n\n``server_id`` is the UUID from ``GET /v1/servers``\
        \ list rows. The response\nincludes derived fields computed per request \u2014\
        \ ``connection_status``,\n``url``, and the ``attention_tier`` / ``publish_blockers``\
        \ publish-state\npair \u2014 alongside the stored record."
      operationId: get_mcp_server
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Server Id
      - name: include_service_accounts
        in: query
        required: false
        schema:
          type: boolean
          description: Include service account connections for can_manage_policies
            computation (does not affect connection_status)
          default: false
          title: Include Service Accounts
        description: Include service account connections for can_manage_policies computation
          (does not affect connection_status)
      - name: include_connection_status
        in: query
        required: false
        schema:
          type: boolean
          description: Include connection_status computation (requires Bao calls).
            Set to false for better performance when connection_status is not needed.
          default: true
          title: Include Connection Status
        description: Include connection_status computation (requires Bao calls). Set
          to false for better performance when connection_status is not needed.
      responses:
        '200':
          description: Successfully retrieved server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '404':
          description: MCP server not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/registry/v1/servers/by-slug/{slug}:
    get:
      tags:
      - registry
      summary: Get Mcp Server By Slug
      description: 'Return details for an individual MCP server by slug.


        Uses the slug and organization ID from auth context to fetch the server.

        This is useful for fetching server details when you only have the service
        name/slug.'
      operationId: get_mcp_server_by_slug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          title: Slug
      - name: include_service_accounts
        in: query
        required: false
        schema:
          type: boolean
          description: Include service account connections for can_manage_policies
            computation (does not affect connection_status)
          default: false
          title: Include Service Accounts
        description: Include service account connections for can_manage_policies computation
          (does not affect connection_status)
      - name: include_connection_status
        in: query
        required: false
        schema:
          type: boolean
          description: Include connection_status computation (requires Bao calls).
            Set to false for better performance when connection_status is not needed.
          default: true
          title: Include Connection Status
        description: Include connection_status computation (requires Bao calls). Set
          to false for better performance when connection_status is not needed.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/registry/v1/servers/{server_id}/publish:
    post:
      tags:
      - registry
      summary: Publish Mcp Server
      description: "BCP-3039 \u2014 one-way publish gate.\n\nPublishing makes a server\
        \ discoverable in end-user listings\n(``published_at IS NOT NULL``). It is\
        \ deliberately one-way: there is no\nunpublish, and later operational-state\
        \ changes never hide a published\nserver \u2014 taking a server out of service\
        \ means deactivating its policies.\n\nPreconditions (422 when unmet):\n- the\
        \ server is operationally available (``server_available_expr``:\n  status=active\
        \ AND requires_auth=false / embedded-local source / a\n  \"connected\" tenant\
        \ service-account connection), and\n- it has at least one ACTIVE policy (verified\
        \ against policy-service with\n  the caller's own token; 403 when policy-service\
        \ refuses the caller,\n  503 when it can't answer).\n\nRe-publishing an already-published\
        \ server is an idempotent no-op success.\n\nAudit: every rejected publish\
        \ of an existing server (403/422/503) and every\nstate-changing success emit\
        \ an event; the idempotent no-op does not, so the\naudit trail means \"a publish\
        \ happened\"."
      operationId: publish_mcp_server
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Server Id
      responses:
        '200':
          description: "Published \u2014 or already published, an idempotent no-op"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResponse'
        '403':
          description: policy-service refused the caller
        '404':
          description: MCP server not found
        '422':
          description: 'Publish gate refused: server not operationally available,
            or no ACTIVE policy'
        '503':
          description: policy-service could not answer; publish state unchanged
  /api/registry/v1/servers/{server_id}/connect:
    post:
      tags:
      - registry
      summary: Authenticate an already-registered server
      description: "Authenticates the caller against an MCP server that is ALREADY\
        \ registered in this organization. It does not add a server: a `server_id`\
        \ that is not yet registered returns 404, and a catalog (directory) id is\
        \ never valid here \u2014 that ordering is the usual reason this endpoint\
        \ 404s. Registering a server is not available as a tool; an operator adds\
        \ it in the console first.\n\nFor OAuth providers it returns an authorization\
        \ URL for the user to visit. For non-OAuth providers (api_key, bearer_token,\
        \ basic_auth, generic) credentials go in the request body \u2014 prefer a\
        \ server registered with managed credentials so no secret passes through the\
        \ caller at all, and never solicit one in a chat transcript.\n\n`as_service:\
        \ true` connects the tenant's shared service account rather than the calling\
        \ user, which is what a server needs before it can be published."
      operationId: connect_mcp_server
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      - name: return_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional return URL for redirecting the user after connection
            completes.
          title: Return Url
        description: Optional return URL for redirecting the user after connection
          completes.
      - name: scopes
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Optional space-delimited runtime scope override for the OAuth
            auth URL. Precedence is: query scopes > server resolved scopes > directory
            fallback.'
          title: Scopes
        description: 'Optional space-delimited runtime scope override for the OAuth
          auth URL. Precedence is: query scopes > server resolved scopes > directory
          fallback.'
      - name: as_service
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: As Service
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CredentialsPayload'
              - type: 'null'
              description: Credentials for non-OAuth providers (api_key, bearer_token,
                basic_auth, generic). Not required for OAuth providers.
              title: Credentials
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionInitiateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/registry/v1/servers/{server_id}/connection:
    get:
      tags:
      - registry
      summary: Get Connection
      description: Get the current user's (or service-account) connection status for
        this server.
      operationId: get_mcp_server_connection
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      - name: as_service
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: As Service
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - registry
      summary: Delete Connection
      description: Delete the current user's (or service-account) connection to this
        server.
      operationId: disconnect_mcp_server
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      - name: as_service
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: As Service
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/registry/v1/servers/{server_id}/connection/auth-error:
    post:
      tags:
      - registry
      summary: Report Connection Auth Error
      description: "Mark the calling user's connection as needing re-authorization.\n\
        \nCalled by tool-router when the upstream provider rejects the stored OAuth\n\
        token mid-use (e.g. a Salesforce session revoked out-of-band while the\nrecorded\
        \ expiry is still in the future), so the UI flips to a reconnect\nprompt instead\
        \ of continuing to show \"connected\".\n\nScoped to the caller's own connection\
        \ on this server \u2014 it cannot affect\nother users' connections or the\
        \ server configuration, so the worst a\nmisbehaving caller can do is force\
        \ themselves to reconnect."
      operationId: report_mcp_connection_auth_error
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      - name: rejected_fingerprint
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 64
            maxLength: 64
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Rejected Fingerprint
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
