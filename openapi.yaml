    BillingMode:
      type: string
      description: "Whether the gateway computes a per-token cost for a provider.\
        \ Persisted as\na `VARCHAR(16)` constrained to `per_token | not_metered` (see\
        \ migration\nV69, BCP-3876).\n\nDeliberately binary, with the *why* held separately\
        \ in [`BillingReason`].\nThe reason list is open-ended; this question is not,\
        \ and never will be.\nFolding both into one enum would make every \"is this\
        \ zero-cost\" check grow\nan OR-list as reasons are added, and would need\
        \ a [`PricingSource`] variant\nper reason \u2014 an enum whose values reach\
        \ ClickHouse, the reporting labels, a\nfrontend union type and three UI modules.\n\
        \n[`PricingSource`]: ai_governance::PricingSource"
      enum:
      - per_token
      - not_metered
    BillingReason:
      type: string
      description: "How the vendor bills a provider. Persisted as a nullable `VARCHAR(16)`,\n\
        required when `billing_mode = 'not_metered'` and optional otherwise (V69\n\
        CHECK-enforced).\n\n**Independent of [`BillingMode`], not paired with it.**\
        \ A subscription that\nbills overages beyond the plan is genuinely per-token\
        \ *and* genuinely a\nsubscription; requiring the two to agree made that unrepresentable.\
        \ What\nsurvives is the half worth keeping: a provider must not stop recording\
        \ cost\nwithout saying why.\n\n**Label only \u2014 nothing branches on this.**\
        \ That is the point of separating\nit from [`BillingMode`]: adding a reason\
        \ touches this enum, its label maps\nand the CHECK constraint, and never the\
        \ billing path. If a proposed\ncategory needs different *behaviour* (prepaid\
        \ credits drawing down a\nbalance, committed spend needing a floor), it is\
        \ a feature, not a variant\nhere."
      enum:
      - subscription
      - local
      - external
      - other
    BudgetAction:
      type: string
      enum:
      - block
      - throttle
      - warn
    BudgetLimitKind:
      type: string
      description: Which limit on the budget actually exhausted.
      enum:
      - token
      - cost
    BudgetPeriod:
      type: string
      description: "How often a budget's counter resets.\n\n**Every period boundary\
        \ is UTC**, with no per-org configuration:\n`key_suffix` formats `Utc::now()`,\
        \ so `Daily` rolls at 00:00 UTC, `Weekly`\nat Monday 00:00 UTC (ISO-8601 week),\
        \ and `Monthly` on the 1st at 00:00 UTC.\nAn admin in a western timezone therefore\
        \ sees their \"daily\" cap reset in\nthe afternoon \u2014 [`Self::period_end`]\
        \ exists so the UI can say so rather\nthan leave them to infer it (BCP-4204)."
      enum:
      - daily
      - weekly
      - monthly
    BudgetTargetKind:
      type: string
      description: 'Which target dimension the exhausted budget is scoped to. Drives
        the

        pill label in the admin Model Mappings page and the user-portal Models

        page.'
      enum:
      - provider
      - upstream_model
      - model_alias
    BudgetTargetStatus:
      type: object
      description: 'Per-mapping annotation: a budget that is currently blocking traffic
        for

        the (provider, upstream, alias) the mapping resolves to. Serialised as

        `budget_status` on each listing row.'
      required:
      - kind
      - limit_kind
      - budget_id
      - budget_name
      - period
      - percentage_used
      - message
      properties:
        budget_id:
          type: string
          format: uuid
        budget_name:
          type: string
        kind:
          $ref: '#/components/schemas/BudgetTargetKind'
        limit_kind:
          $ref: '#/components/schemas/BudgetLimitKind'
        message:
          type: string
          description: Short human-readable summary suitable for a tooltip / pill
            label.
        percentage_used:
          type: number
          format: double
        period:
          type: string
    ChangeAttribution:
      type: object
      description: 'The attribution carried on an admin-configurable row, as returned
        to the

        portal.


        Every field is `Option` and nothing is backfilled: a row that predates V75

        has no truthful actor to attribute it to, and inventing one would be worse

        than rendering a placeholder. Rows pick up attribution on their first

        write.'
      properties:
        created_by_email:
          type:
          - string
          - 'null'
        created_by_name:
          type:
          - string
          - 'null'
        created_by_user_id:
          type:
          - string
          - 'null'
          format: uuid
        last_change_note:
          type:
          - string
          - 'null'
          description: 'Optional free text explaining *why* the last change was made

            ("Raised for the Q3 batch job", "Vendor deprecated the old endpoint").


            Admin-authored and rendered in the portal, so it is untrusted input:

            length-capped here, escaped on render.'
        last_modified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the change named by `last_modified_by_*` happened.


            Its own column rather than the row''s `updated_at`, because `updated_at`

            is bumped by writes nobody is attributed for -- pairing the two would

            date a named admin''s edit to a background job''s clock. See the V75

            migration for the full reasoning.'
        last_modified_by_email:
          type:
          - string
          - 'null'
        last_modified_by_name:
          type:
          - string
          - 'null'
        last_modified_by_user_id:
          type:
          - string
          - 'null'
          format: uuid
    ChannelListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ChannelResponse'
          type: array
          title: Data
          description: The channels, in no guaranteed order.
      type: object
      required:
      - data
      title: ChannelListResponse
      description: "A page-less list of channels. Unpaginated by design \u2014 the\
        \ number of channels an\norganization has is small and bounded by hand-configuration."
    ChannelOptionsResponse:
      properties:
        alert_types:
          items:
            $ref: '#/components/schemas/AlertTypeOption'
          type: array
          title: Alert Types
          description: "Every alert type your organization may subscribe a channel\
            \ to. Authoritative: types withheld here are gated off for this organization\
            \ and subscribing to one is inert. Read this instead of hardcoding the\
            \ enum \u2014 the set grows over time."
        categories:
          items:
            $ref: '#/components/schemas/LabeledOption'
          type: array
          title: Categories
          description: The categories your organization may see, in display order.
            A category whose every alert type is gated off for this organization is
            withheld entirely, so it needs no client-side handling; a category that
            is simply reserved and has no alert types yet is still listed and groups
            nothing.
        severities:
          items:
            $ref: '#/components/schemas/LabeledOption'
          type: array
          title: Severities
          description: The full severity vocabulary, unfiltered.
      type: object
      required:
      - alert_types
      - categories
      - severities
      title: ChannelOptionsResponse
      description: 'The subscription vocabulary, enumerated server-side so new alert
        types appear to every

        client without a code change. `alert_types` is filtered to what the caller''s
        organization is

        admitted to; `categories` and `severities` are the full closed label vocabularies
        the types

        reference. Fetch this before building a subscription set rather than hardcoding
        enum names.'
    ChannelResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Server-assigned channel id. Stable across updates; pass it
            as `id` to edit by id.
        type:
          $ref: '#/components/schemas/ChannelType'
          description: The kind of destination. See `ChannelType`.
        enabled:
          type: boolean
          title: Enabled
          description: Whether the channel currently delivers.
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
          description: Owning user for a personal channel (`in_app`, `user_email`).
            `null` for the org-wide types, which belong to the organization rather
            than one user.
        email_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Email Address
          description: 'Destination address for `type: email`, normalized. `null`
            for every other type.'
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: 'Destination endpoint for `type: webhook`. `null` for every
            other type.'
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: Human-readable name, set for `slack` and `teams`. `null` for
            the other types.
        slack_channel_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Slack Channel Id
          description: 'Slack channel id for `type: slack`. `null` for every other
            type.'
        subscriptions:
          items:
            $ref: '#/components/schemas/ChannelSubscription'
          type: array
          title: Subscriptions
          description: The alert types this channel currently delivers. Empty means
            it delivers nothing.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When the channel was created (UTC).
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: When the channel or its subscriptions last changed (UTC).
        has_signing_secret:
          type: boolean
          title: Has Signing Secret
          description: "Whether a `webhook` channel has a stored signing secret \u2014\
            \ always true for a webhook channel, false otherwise. The secret itself\
            \ is never readable back; use `POST /channels/{channel_id}/regenerate-secret`\
            \ to obtain a fresh one."
          default: false
        has_workflow_url:
          type: boolean
          title: Has Workflow Url
          description: Whether a `teams` channel has a stored Workflows URL. The URL
            is a secret and is never returned; this flag is the only readable signal
            that one is configured.
          default: false
        signing_secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Signing Secret
          description: "One-time reveal of a newly generated webhook signing secret.\
            \ Present **only** on the response to the request that created it \u2014\
            \ the `PUT` that first creates a `webhook` channel \u2014 and `null` on\
            \ every list or subsequent read. Store it when you receive it; the only\
            \ way to recover from losing it is to rotate."
      type: object
      required:
      - id
      - type
      - enabled
      - user_id
      - email_address
      - url
      - label
      - slack_channel_id
      - subscriptions
      - created_at
      - updated_at
      title: ChannelResponse
      description: 'A channel and its subscriptions. Secrets (webhook signing secret,
        slack bot token) live

        in OpenBao and are never surfaced here except as a one-time reveal via ``signing_secret``,

        populated only on the response to the request that just generated it (webhook
        create or

        regenerate); slack channels expose only the non-secret ``label`` + ``slack_channel_id``.'
    ChannelSubscription:
      properties:
        alert_type:
          $ref: '#/components/schemas/AlertType'
          description: The subscribed alert type.
      type: object
      required:
      - alert_type
      title: ChannelSubscription
      description: One alert type this channel is subscribed to.
    ChannelSubscriptionInput:
      properties:
        alert_type:
          $ref: '#/components/schemas/AlertType'
          description: The alert type to deliver to this channel. Must be one of the
            values returned by `GET /public/v1/channels/options`; subscribing to a
            type your organization is not admitted to is accepted but inert.
          examples:
          - mcp_server_added
      type: object
      required:
      - alert_type
      title: ChannelSubscriptionInput
      description: "One alert type the channel matches on.\n\nNamed ``Channel``-first\
        \ deliberately: these schemas are merged by name into the unified\npublic\
        \ OpenAPI document (scripts/generate-public-openapi.py), where a bare\n``SubscriptionResponse``\
        \ collided with identity-service's *payment* subscription schema and\nsilently\
        \ lost the tie. Keep the prefix. A channel receives an alert only if its\n\
        subscription set contains that alert's type \u2014 an empty set means the\
        \ channel exists but\ndelivers nothing."
    ChannelTestResponse:
      properties:
        ok:
          type: boolean
          title: Ok
          description: Whether the test message reached the destination transport.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Why delivery failed, when `ok` is false. `null` on success.
      type: object
      required:
      - ok
      title: ChannelTestResponse
      description: 'Result of sending a stock connectivity-test message through a
        channel''s real transport.


        Delivery failure is reported here as `ok: false` with a `200` status, not
        as an HTTP error:

        the request to test succeeded, the transport is what failed.'
    ChannelType:
      type: string
      enum:
      - in_app
      - user_email
      - email
      - webhook
      - slack
      - teams
      title: ChannelType
      description: "What kind of destination a channel delivers to. The type is the\
        \ discriminator for the\nwhole channel model: it decides which destination\
        \ field is required, whether the channel is\npersonal (owned by one user)\
        \ or org-wide (managed by an admin), and which natural-identity\nkey an upsert\
        \ without ``id`` dedupes on.\n\nPersonal \u2014 owner is always the authenticated\
        \ caller, never taken from the request body:\n\n- ``in_app``: the caller's\
        \ notification inbox in the platform UI. No destination field.\n- ``user_email``:\
        \ the caller's own verified account email. No destination field.\n\nOrg-wide\
        \ \u2014 admin/superadmin managed, one set per organization:\n\n- ``email``:\
        \ an arbitrary address (a team alias, a ticketing inbox). Requires\n  ``email_address``;\
        \ deduped on it.\n- ``webhook``: an HTTPS endpoint you own, signed with a\
        \ Standard Webhooks\n  ``whsec_`` secret. Requires ``url``; deduped on it.\n\
        - ``slack``: a channel in the organization's connected Slack workspace. Requires\n\
        \  ``slack_channel_id`` + ``label``; needs the Slack app installed first (an\
        \ interactive\n  consent flow that is not part of this API).\n- ``teams``:\
        \ a Microsoft Teams channel behind a Workflows incoming-webhook URL. Requires\n\
        \  ``label``, plus ``teams_workflow_url`` on create."
    ChannelUpsertRequest:
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Id
          description: "Existing channel to edit authoritatively. Omit to create-or-dedup\
            \ on the type's natural identity (see the model description). When supplied\
            \ and unknown \u2014 or owned by another organization \u2014 the request\
            \ is a `404`, never a create."
        type:
          $ref: '#/components/schemas/ChannelType'
          description: 'The kind of destination, and the discriminator for every other
            field. Immutable in practice: an edit-by-id that changes `type` is rejected,
            and an upsert without `id` and a different `type` addresses a different
            natural identity, so it creates a separate channel.'
        enabled:
          type: boolean
          title: Enabled
          description: "Whether the channel delivers. `false` suspends delivery while\
            \ keeping the channel and its subscriptions intact \u2014 the reversible\
            \ alternative to deleting it."
          default: true
        email_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Email Address
          description: "Destination address for `type: email`. Any deliverable address\
            \ \u2014 a team alias or a ticketing inbox, not necessarily a platform\
            \ user. Validated and normalized; also the channel's natural identity,\
            \ so reusing an address updates that channel. Forbidden on every other\
            \ type."
          examples:
          - security-ops@example.com
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: "Destination endpoint for `type: webhook`. Must be `https`\
            \ and must resolve to a public address \u2014 private, loopback, link-local,\
            \ and cloud-metadata targets are rejected with a `422` naming the reason.\
            \ Also the channel's natural identity. Forbidden on every other type."
          examples:
          - https://hooks.example.com/barndoor
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: Human-readable name, shown wherever the channel is listed.
            Required for `slack` and `teams` (for `teams` it is the only non-secret
            identifier you get back). Forbidden on the other types.
          examples:
          - '#security-alerts'
        slack_channel_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Slack Channel Id
          description: 'Slack channel id (not its name) for `type: slack`; the organization''s
            Slack app must already be installed. Also the channel''s natural identity.
            Forbidden on every other type.'
          examples:
          - C0123456789
        teams_workflow_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Teams Workflow Url
          description: "Microsoft Teams Workflows incoming-webhook URL for `type:\
            \ teams`. Write-only: it is stored as a secret and never returned by any\
            \ endpoint \u2014 reads expose only `has_workflow_url`. Required on create,\
            \ optional on edit-by-id (omit to keep the stored URL). Must be `https`,\
            \ resolve to a public address, and sit on the Power Automate host allowlist.\
            \ Forbidden on every other type."
        subscriptions:
          items:
            $ref: '#/components/schemas/ChannelSubscriptionInput'
          type: array
          title: Subscriptions
          description: "The complete set of alert types to deliver to this channel.\
            \ **Replaces** the channel's existing set \u2014 an omitted or empty list\
            \ unsubscribes it from everything. At most one entry per alert type; duplicates\
            \ are a `422`."
      type: object
      required:
      - type
      title: ChannelUpsertRequest
      description: "Create or update one notification channel and replace its subscription\
        \ set.\n\nThis is a full upsert, not a patch: ``subscriptions`` is **replaced**\
        \ by what you send, so\nomitting it removes every subscription the channel\
        \ had. Send the complete desired set on\nevery call \u2014 which is what makes\
        \ the endpoint safe to drive from a declarative tool.\n\nWhich fields are\
        \ permitted depends on ``type``; sending one that does not belong to the\n\
        type is a ``422``, not a silently ignored field. See ``ChannelType`` for the\
        \ full matrix.\n\n| ``type`` | required | forbidden |\n|---|---|---|\n| ``in_app``\
        \ / ``user_email`` | \u2014 | every destination field |\n| ``email`` | ``email_address``\
        \ | ``url``, ``label``, ``slack_channel_id``, ``teams_workflow_url`` |\n|\
        \ ``webhook`` | ``url`` | ``email_address``, ``label``, ``slack_channel_id``,\
        \ ``teams_workflow_url`` |\n| ``slack`` | ``slack_channel_id``, ``label``\
        \ | ``email_address``, ``url``, ``teams_workflow_url`` |\n| ``teams`` | ``label``\
        \ (+ ``teams_workflow_url`` on create) | ``email_address``, ``url``, ``slack_channel_id``\
        \ |\n\n**Identity.** Without ``id`` the channel is keyed on its type's natural\
        \ identity, so\nrepeating the same call is idempotent rather than creating\
        \ duplicates: personal types by\n(organization, type, caller), ``email`` by\
        \ (organization, ``email_address``), ``webhook`` by\n(organization, ``url``),\
        \ ``slack`` by (organization, ``slack_channel_id``). With ``id`` it is\nan\
        \ authoritative edit of that row \u2014 the only way to change a ``teams``\
        \ channel, whose\nnatural identity is a secret URL you never hold back."
      examples:
      - enabled: true
        subscriptions:
        - alert_type: break_glass_used
        - alert_type: policy_changed
        type: webhook
        url: https://hooks.example.com/barndoor
      - email_address: security-ops@example.com
        subscriptions:
        - alert_type: connection_broken
        type: email
      - enabled: false
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        subscriptions:
        - alert_type: break_glass_used
        type: webhook
        url: https://hooks.example.com/barndoor
