          scope_id:
            type:
            - string
            - 'null'
            format: uuid
          scope_type:
            $ref: '#/components/schemas/ScopeType'
          scope_value:
            type:
            - string
            - 'null'
          target_mcp_server_id:
            type:
            - string
            - 'null'
            format: uuid
            description: "BCP-4053 Target dimension: when set, the budget only fires\
              \ on requests\nrouted to this MCP server. The MCP-traffic counterpart\
              \ of\n`target_provider_id`, and mutually exclusive with all three LLM\
              \ target\ncolumns (DB-enforced by `token_budgets_mcp_target_exclusive_check`)\
              \ \u2014\nno single request carries both an MCP server and an LLM route,\
              \ so a\nrow naming both could never match.\n\nDistinct from a `ScopeType::McpServer`\
              \ budget, which puts the server on\nthe *identity* axis and so cannot\
              \ be combined with a user or group.\nAs a target it composes freely\
              \ with any scope, which is what makes\n\"this user's cap on this server\"\
              \ expressible."
          target_model_alias:
            type:
            - string
            - 'null'
            description: 'BCP-2813 Target dimension: when set, the budget only fires
