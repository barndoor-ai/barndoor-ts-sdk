            it.'
        billing_reason:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BillingReason'
            description: '`None` (omitted) leaves the reason unchanged; `Some(None)`
              (JSON

              `null`) clears it, which is only valid while the provider is (or is

              becoming) `per_token`. Deserialized tri-state for the same reason

              `connection_id` is: serde would otherwise collapse `null` and missing,

              so clearing a reason would be indistinguishable from not mentioning
              it.'
        change_note:
          type:
          - string
          - 'null'
          description: "Optional free-text note explaining why this edit was made\
            \ (BCP-3998).\n\nDeliberately *not* tri-state like `billing_note` directly\
            \ above, and\nthe contrast is the point: a billing note describes a standing\n\
            arrangement, so omitting it must leave it alone. A change note\ndescribes\
            \ one edit, so omitting it clears the previous one \u2014 otherwise\n\
            an unrelated later edit would inherit an explanation written for a\ndifferent\
            \ change."
        connection_id:
          type:
          - string
          - 'null'
          format: uuid
          description: '`None` (field omitted) leaves `connection_id` unchanged.

            `Some(None)` (JSON `null`) clears the connection, switching the

            provider back to per-provider direct credentials. `Some(Some(id))`

            (re)binds the provider to a shared connection. Without the custom

            deserializer below, serde would collapse the `null` and missing

            cases to `None`, leaving the provider silently bound to its

            previous shared credential even when the UI shows "Direct".'
        credentials: {}
        enabled:
          type:
          - boolean
          - 'null'
        enforce_health_check:
          type:
          - boolean
          - 'null'
          description: '`None` (omitted) leaves the health-gate override unchanged.

            `Some(true)` enforces the gate; `Some(false)` bypasses it so the

            provider serves even when its connectivity probe is failing.'
        model_sync_mode:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ModelSyncMode'
            description: '`None` (omitted) leaves the catalog-sync mode unchanged
              (BCP-3811).'
        name:
          type:
          - string
          - 'null'
        request_timeout_secs:
          type:
          - integer
          - 'null'
          format: int32
          description: '`None` (omitted) leaves the column unchanged. `Some(None)`
            (JSON

            `null`) clears the provider-tier override. `Some(Some(secs))` sets it;

            the range is fixed platform policy

            (`TOTAL_REQUEST_TIMEOUT_MIN_SECS..=TOTAL_REQUEST_TIMEOUT_MAX_SECS`, see

            [`crate::proxy::timeouts`]).'
        settings: {}
        stream_idle_timeout_secs:
          type:
          - integer
          - 'null'
          format: int32
          description: '`None` (omitted) leaves the column unchanged. `Some(None)`
