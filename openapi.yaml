        mask_char:
          type: string
        preserve_separators:
          type: boolean
      additionalProperties: false
    MaskKeep:
      type: string
      enum:
      - PREFIX
      - SUFFIX
    MetadataPatchRequest:
      type: object
      properties:
        active:
          type:
          - boolean
          - 'null'
        display_name:
          type:
          - string
          - 'null'
    ModelAccessTarget:
      oneOf:
      - type: object
        description: "Match by user-facing model alias (with optional trailing `*`\n\
          wildcard) \u2014 i.e. whatever the caller put in the `model` field.\n\n\
          Use this for aliases that may map to multiple providers (e.g. a\n`goto`\
          \ alias fanned out across OpenAI and Anthropic): the policy\nfires whenever\
          \ a request uses that alias, regardless of routing."
        required:
        - alias
        - kind
        properties:
          alias:
            type: string
          kind:
            type: string
            enum:
            - model_alias
      - type: object
        description: 'Match by concrete upstream model (with optional trailing `*`

          wildcard). The admin UI populates this from the distinct list of

          `upstream_model` values across all mappings, labelled with the

          provider family (e.g. `gpt-4o (openai)`). Matching evaluates

          against the resolved route''s `upstream_model`, so it fires even

          when the request used a custom alias that resolves to this model.'
        required:
        - model
        - kind
        properties:
          kind:
            type: string
            enum:
            - model
          model:
            type: string
      - type: object
        description: "Match any model served by the given provider connection.\n\n\
          Asymmetric between the two policy directions \u2014 see\n[`ModelAccessTarget::grants`].\
          \ As a *denial* this covers everything\nrouted to the provider, custom aliases\
          \ included. As a *grant* it\ncovers the provider's own models only."
        required:
        - provider_id
        - kind
        properties:
          kind:
            type: string
            enum:
            - provider
          provider_id:
            type: string
            format: uuid
      - type: object
        description: "Match the (provider, model alias) combination \u2014 used to\
          \ allow/deny a\nspecific model only when it goes through a specific provider."
        required:
        - provider_id
        - model
        - kind
        properties:
          kind:
            type: string
            enum:
            - provider_model
          model:
            type: string
          provider_id:
            type: string
            format: uuid
      - type: object
        description: "Match every route in a named route group (BCP-3961) \u2014 the\
          \ way an org\nsays \"the Engineering team's routes\" once instead of listing\
          \ aliases\nand re-editing the policy whenever a route is added.\n\n**This\
          \ variant never reaches [`ModelAccessTarget::matches`].**\n[`ModelAccessPolicyDb::get_enabled_by_org`]\
          \ \u2014 the only load path\ngovernance uses \u2014 expands it into one\
          \ [`ModelAccessTarget::ModelAlias`]\nper member alias, so the request path\
          \ stays a pure function over\n[`MatchContext`] with no database access.\
          \ `matches`/`grants` still\nanswer `false` for it as a fail-safe: if some\
          \ future load path forgets\nto expand, a group target denies nothing and\
          \ grants nothing rather than\nmatching everything.\n\n`list_by_org` (the\
          \ admin path) deliberately does *not* expand, so the\npolicy editor shows\
          \ \"Engineering\" rather than its fourteen members."
        required:
        - group_id
        - kind
        properties:
          group_id:
            type: string
            format: uuid
          kind:
            type: string
            enum:
            - route_group
      description: "A single restriction target inside a [`ModelAccessPolicy`].\n\n\
        Targets answer the question \"*what* is being allowed/denied?\" \u2014 distinct\n\
        from `scope_type`, which answers \"*who* is the policy applied to?\". A\n\
        policy's `targets` list is OR-ed when matching: a request matches the\npolicy\
        \ if any one of its targets matches the (provider, model) pair.\n\nSerialised\
        \ to JSONB with a `kind` discriminator so it round-trips cleanly\nthrough\
        \ the admin REST API.\n\n`ModelAlias` matches against the literal `model`\
        \ field in the request.\n`Model` matches against the *resolved upstream model*\
        \ \u2014 i.e. the underlying\nmodel the routed mapping points at. The two\
        \ are distinct because the\nadmin UI lets admins pick along either dimension:\
        \ a `goto` alias fanned\nout across providers is best expressed with `ModelAlias`,\
        \ while \"block any\nrequest that ends up at gpt-4o-mini regardless of the\
        \ alias used\" is best\nexpressed with `Model` (so it fires even when `goto`\
        \ resolves to\n`gpt-4o-mini`)."
    ModelMapping:
      allOf:
      - $ref: '#/components/schemas/ChangeAttribution'
        description: 'Who created and last changed this route, and why (BCP-3998).


          Read with `try_get`, so the reads that don''t select the columns come

          back unattributed rather than failing.'
      - type: object
        required:
        - id
        - provider_id
        - model_alias
        - upstream_model
        - enabled
        - priority
        - retry_on_429_count
        - retry_on_429_max_wait_secs
        - bare_alias
        - source
        properties:
          auto_disabled_reason:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/AutoDisabledReason'
              description: "Set when the *gateway* turned this row off (BCP-3811's\
                \ `full` sync\nretiring a model the catalog dropped). `None` means\
                \ a human decided\nthe `enabled` flag, and the reconciler will not\
                \ touch it in either\ndirection \u2014 see migration V63. Any admin\
                \ write to `enabled` clears this.\n\nClearing it is *not* a durable\
                \ claim on the row, and it is easy to read\nit that way. It protects\
                \ a human's **disable** \u2014 the re-enable branch\nrequires the\
                \ marker to be present, so a row a human turned off is never\nturned\
                \ back on. It cannot protect a human's **re-enable**: a cleared\n\
                marker is exactly what makes the row eligible for retirement again,\
                \ so\nunder `full` a model the catalog still does not list is re-disabled\
                \ on\nthe next tick. That is `full`'s contract (\"enabled set tracks\
                \ the\ncatalog\"), not a bug \u2014 see\n`model_sync::tests::re_enabling_a_dropped_model_is_retired_again_on_the_next_tick`."
          bare_alias:
            type: boolean
            description: "When `true` the row participates in bare-name resolution\n\
              (`POST /v1/chat/completions {\"model\": \"<alias>\"}`). When `false`\
              \ the\nrow is enablement-only \u2014 addressable solely via the explicit\n\
              `<provider>/<upstream>` form. Custom-alias rows\n(`model_alias != upstream_model`)\
              \ are always `true`; 1:1 rows\ndefault to `false` and admins opt in\
              \ by creating an explicit Route\non the Model Routes tab."
          enabled:
            type: boolean
          id:
            type: string
            format: uuid
          model_alias:
            type: string
          priority:
            type: integer
            format: int32
          provider_id:
            type: string
            format: uuid
          request_timeout_secs:
            type:
            - integer
            - 'null'
            format: int32
            description: 'Per-mapping (route-tier / model-tier) total-request timeout
              for

              non-streaming requests (streaming responses have no total timeout).

              Defaults to `TOTAL_REQUEST_TIMEOUT_DEFAULT_SECS` at insert. On a

              custom-alias row this is the *route* tier; on the 1:1 enablement

              (anchor) row it is the *model* tier consulted by the resolver for

              every alias of that model. The range is fixed platform policy

              (`TOTAL_REQUEST_TIMEOUT_MIN_SECS..=TOTAL_REQUEST_TIMEOUT_MAX_SECS`),

              enforced by the column CHECK.'
          retry_on_429_count:
            type: integer
            format: int32
            description: Same-route retries on upstream 429. 0 means immediate failover.
          retry_on_429_max_wait_secs:
            type: integer
            format: int32
            description: 'Cap on honoring upstream `Retry-After` header. 0 means use
              a small

              built-in default and ignore the header value.'
          source:
            $ref: '#/components/schemas/ModelSource'
            description: "Whether the model was picked from the provider catalog or\
              \ typed in by\nan admin. Stamped once at create time and never recomputed\
              \ \u2014 see\n[`ModelSource`] and migration V61."
          stream_idle_timeout_secs:
            type:
            - integer
            - 'null'
            format: int32
            description: 'Per-mapping stream-idle (per-chunk) timeout for streaming
              responses.

              Defaults to `STREAM_IDLE_TIMEOUT_DEFAULT_SECS` at insert; enforced via

              `tokio::time::timeout` around each upstream SSE/eventstream chunk

              read. The range is fixed platform policy

              (`STREAM_IDLE_TIMEOUT_MIN_SECS..=STREAM_IDLE_TIMEOUT_MAX_SECS`),

              enforced by the column CHECK.'
          upstream_model:
            type: string
    ModelMappingWithBudgetStatus:
