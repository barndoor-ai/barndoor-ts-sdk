    Expression:
      properties:
        expr:
          type: string
          title: Expr
          description: "A single CEL expression that must evaluate to a boolean. Top-level\
            \ variables: C, G, P, R, V, constants, globals, request, runtime, variables.\
            \ `P` is the calling principal and `R` the resource (the tool call being\
            \ authorized). Commonly used attributes: `P.attr.groups` and `P.attr.roles`\
            \ hold the UNPREFIXED role and group names from the user's profile \u2014\
            \ note the contrast with a rule's `roles_groups`, whose entries are `role:`/`group:`-prefixed;\
            \ other IdP profile fields such as `P.attr.department` are available;\
            \ and `R.attr.<argument>` exposes the tool call's own arguments. Expressions\
            \ are compiled at write time and rejected if invalid or if they reference\
            \ an unknown variable."
          examples:
