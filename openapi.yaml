            - $ref: '#/components/schemas/RouteHealthStatus'
          stale_status:
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ModelStaleStatus'
              description: See [`ModelMappingWithBudgetStatus::stale_status`].
      description: 'Same wrapper but for the cross-provider listing endpoint that
        returns

        `ModelMappingWithProvider` (extra `provider_name` field).'
    ModelPricing:
      type: object
      required:
      - id
      - org_id
      - model_pattern
      - input_cost_per_million_tokens
      - output_cost_per_million_tokens
      - effective_from
      properties:
        cache_read_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
          description: "Per-million-token cost for input tokens served from the prompt\n\
            cache. `None` \u21D2 the calculator bills cached input at\n`input_cost_per_million_tokens`."
        cache_write_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
          description: "Per-million-token cost for input tokens added to the prompt\
            \ cache.\n`None` \u21D2 same fallback as `cache_read_cost_per_million_tokens`."
        catalog_slug:
          type:
          - string
          - 'null'
          description: Catalog slug for provider-level pricing (e.g. "openai", "aws_bedrock").
        effective_from:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        input_cost_per_million_tokens:
          type: number
          format: double
        long_context:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/LongContextTier'
            description: "Optional context-tiered surcharge (BCP-3904). `None` \u21D2\
              \ one rate set\nat every prompt size, i.e. exactly the pre-BCP-3904\
              \ behaviour.\n\nSerialized as `long_context`, not as the Rust field\
              \ name. This struct\nreaches the admin API through `AdminModelPricing`'s\n\
              `#[serde(flatten)]`, so the field name here *is* the wire key \u2014\
              \ and\nevery sibling surface (`DefaultPricingEntry`, `EffectivePricing`,\
              \ the\ncreate/update request bodies) already spells it `long_context`.\
              \ Left\nunrenamed, the pricing tab would write a tier successfully and\
              \ then\nread back nothing, which is precisely how it behaved before\
              \ this\nattribute existed: the surcharge saved, the dialog reopened\
              \ unchecked,\nand the edit looked silently discarded. Pinned by\n`admin_model_pricing_serializes_the_tier_as_long_context`."
        model_pattern:
          type: string
        model_provider:
          type:
          - string
          - 'null'
        org_id:
          type: string
          format: uuid
        output_cost_per_million_tokens:
          type: number
          format: double
        provider_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Optional reference to a specific LLM Gateway provider instance.
        provider_name:
          type:
          - string
          - 'null'
    ModelRouteGroup:
      allOf:
      - $ref: '#/components/schemas/ChangeAttribution'
        description: 'Who created and last changed this group, and why (BCP-3998).


          Group-level, not per member row: membership is edited as a *set*

          (`set_members` replaces the whole list), so "who added this one alias"

          is not a question the write path can answer, while "who last changed

          this group" is exactly what these columns record.'
      - type: object
        required:
        - id
        - org_id
        - name
        - description
        - model_aliases
        properties:
          description:
            type: string
          id:
            type: string
            format: uuid
          model_aliases:
            type: array
            items:
              type: string
            description: "Member aliases, alphabetical. Empty for a group nobody has\
              \ filled in\nyet \u2014 which is a legitimate state, not an error: an\
              \ admin can create\nthe group, attach it to a policy, and populate it\
              \ afterwards."
          name:
            type: string
          org_id:
            type: string
            format: uuid
      description: "A route group plus its membership, which is how both the admin\
        \ list and\nthe routes table want it \u2014 the UI renders a chip per group\
        \ on each route,\nso shipping the aliases with the group saves a second round\
        \ trip and an\ninconsistent intermediate state."
    ModelSource:
      type: string
      description: "Where a `model_mappings` row came from. Persisted as a `VARCHAR(16)`\n\
        constrained to `catalog | custom` (see migration V61).\n\nThis records *intent\
        \ at create time* \u2014 whether an admin picked the model\nout of the provider\
        \ catalog or typed a name into the \"Custom Model\" box \u2014\nand deliberately\
        \ never changes afterwards. It is not a claim about whether\nthe catalog still\
        \ lists the model today: that is live state, drifts as\nvendors retire models,\
        \ and belongs to BCP-3038's stale-route detection.\nKeeping the two apart\
        \ is what lets a retired-from-catalog model avoid\nrendering as a deliberate\
        \ custom choice. See migration V61 for the full\nrationale."
      enum:
      - catalog
      - custom
    ModelStaleStatus:
      type: object
      required:
      - reason
      properties:
        reason:
          $ref: '#/components/schemas/StaleReason'
    ModelSyncMode:
      type: string
      description: 'Whether a provider tracks Barndoor''s model catalog, and how far.
        Persisted

        as a `VARCHAR(16)` constrained to `off | additive | full` (see migration

        V63).


        The three-way split is the whole point: an org that wants new models

        without the gateway ever removing anything, and an org that also wants

        retired models cleaned up, are asking for different things and both are

        legitimate. Retirement stays a separate step up rather than riding along

        with additions, because it is the only one of the two that can take a route

        out of service.'
      enum:
      - 'off'
      - additive
      - full
