  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: "A Barndoor API key, sent as `Authorization: Bearer <key>`. Keys\
        \ are prefixed `bdai_` and are opaque \u2014 do not attempt to decode one.\
        \ Interchangeable with an OAuth 2.0 access token."
    OAuth2:
      type: oauth2
      x-issuer: https://auth.barndoor.ai/realms/barndoor
      description: 'An OAuth 2.0 access token from Barndoor''s identity provider,
        sent as `Authorization: Bearer <token>`. Public clients must use PKCE. Interchangeable
        with an API key.'
      flows:
        authorizationCode:
          authorizationUrl: https://auth.barndoor.ai/realms/barndoor/protocol/openid-connect/auth
          tokenUrl: https://auth.barndoor.ai/realms/barndoor/protocol/openid-connect/token
          scopes:
            openid: Issue an OIDC ID token identifying the caller.
            profile: Read the caller's basic profile claims.
            email: Read the caller's email address.
            offline_access: "Issue a refresh token. Optional \u2014 no operation requires\
              \ it."
        clientCredentials:
