components:
  schemas:
    AWSTrustInfoResponse:
      additionalProperties: false
      properties:
        external_id:
          type: string
        principal_arn:
          type: string
      required:
      - principal_arn
      - external_id
      type: object
    AddRouteGroupMembersRequest:
      type: object
      required:
      - model_aliases
      properties:
        change_note:
          type:
          - string
          - 'null'
          description: "Optional free-text note explaining why these routes were added\n\
            (BCP-3998). Recorded on the group, which is where membership\nattribution\
            \ lives \u2014 see the `ModelRouteGroup::attribution` docs."
        model_aliases:
          type: array
          items:
            type: string
    AdminModelPricing:
      allOf:
      - $ref: '#/components/schemas/ModelPricing'
      - type: object
        required:
        - sync_mode
        - change_source
        - is_archived
        properties:
          change_reason:
            type:
            - string
            - 'null'
          change_source:
            $ref: '#/components/schemas/PricingChangeSource'
          created_by_email:
            type:
            - string
            - 'null'
          created_by_name:
            type:
            - string
            - 'null'
          created_by_user_id:
            type:
            - string
            - 'null'
            format: uuid
          is_archived:
            type: boolean
            description: 'True for tombstone rows produced by `archive_rule` (V35).
              When

              the latest effective version of a group has `is_archived = true`,

              the rule is considered archived: the cost calculator skips it

              and the admin summary list hides it by default. Past non-archived

              versions remain in the timeline so the History dialog can show

              the rule''s full life including the archive event.'
          sync_mode:
            $ref: '#/components/schemas/PricingSyncMode'
      description: 'Admin-API response shape for a single pricing row. Wraps the

        `ai_governance::ModelPricing` used by the cost calculator so that the hot

        path stays sync-mode-agnostic, while the admin surface still gets the

        metadata it needs to render badges, the Review-updates dialog, and (as

        of BCP-2830 v2 / V34) the per-row history timeline.'
    AffectedPoliciesResponse:
      properties:
        archive_count:
          type: integer
          title: Archive Count
        revise_count:
          type: integer
          title: Revise Count
        archive_preview:
          items:
            $ref: '#/components/schemas/AffectedPolicyPreview'
          type: array
          title: Archive Preview
        revise_preview:
          items:
            $ref: '#/components/schemas/AffectedPolicyPreview'
          type: array
          title: Revise Preview
      type: object
      required:
      - archive_count
      - revise_count
      title: AffectedPoliciesResponse
      description: "Response shape for GET /admin/v2/policies/affected-by.\n\nMirrors\
        \ the cascade-handler buckets exactly: ``archive_*`` are policies\nthat would\
        \ transition to ARCHIVED, ``revise_*`` are policies that would\nhave only\
        \ their application_ids set-minus'd (only possible on agent_id\nqueries \u2014\
        \ always 0/[] for mcp_server_id queries)."
    AffectedPolicyPreview:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        status:
          type: string
          title: Status
        mcp_server_id:
          type: string
          title: Mcp Server Id
        application_ids:
          items:
            type: string
          type: array
          title: Application Ids
      type: object
      required:
      - id
      - name
      - status
      - mcp_server_id
      title: AffectedPolicyPreview
      description: "Compact row for the affected-by preview (BCP-1686 \xA7 API Contract).\n\
        \nJust enough to render in the delete-confirmation modal \u2014 id for keying,\n\
        name for display, status so the UI can disambiguate active vs draft."
    AgentPolicyCounts:
      properties:
        agents:
          additionalProperties:
            type: integer
          type: object
          title: Agents
          description: Map of agent ID to policy count
        unscoped:
          type: integer
          title: Unscoped
          description: Number of policies that apply to all agents (no agent scope)
          default: 0
      type: object
      title: AgentPolicyCounts
      description: Policy counts keyed by agent ID, plus a count for unscoped (all-agent)
        policies.
    AgentRuntimeCapabilities:
      type: object
      description: 'The normalized capability contract compiled by barndoor-cli into

        client-specific flags and configuration. The product default is the

        client''s native loop (`client_default`); `locked_down` is an explicit

        named preset, not the omitted-envelope fallback.'
      properties:
        additional_instructions:
          type: string
          default: ''
        allowed_commands:
          type: array
          items:
            type: string
          default: []
        allowed_tools:
          type: array
          items:
            type: string
          default: []
        blocked_commands:
          type: array
          items:
            type: string
          default: []
        blocked_tools:
          type: array
          items:
            type: string
          default: []
        browser:
          type: string
          default: native
        environment:
          type: string
          default: inherit
        filesystem:
          type: string
          default: read_write
        network:
          type: string
          default: native
        preset:
          type: string
          default: client_default
        schema_version:
          type: integer
          format: int32
          default: 1
          minimum: 0
        shell:
          type: string
          default: native
        skills:
          type: boolean
          default: true
        subagents:
          type: boolean
          default: true
    AgentRuntimeProfile:
      type: object
      description: A profile joined with the contract of its `current_version`.
      required:
      - id
      - org_id
      - slug
      - display_name
      - client
      - active
      - is_org_default
      - version
      - config
      - capabilities
      - created_at
      - updated_at
      properties:
        active:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/AgentRuntimeCapabilities'
        client:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
        created_at:
          type: string
          format: date-time
        display_name:
          type: string
        id:
          type: string
          format: uuid
        is_org_default:
          type: boolean
        org_id:
          type: string
          format: uuid
        slug:
          type: string
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int32
          description: The immutable version whose `config` is loaded below.
    AgentType:
      type: string
      enum:
      - internal
      - external
      title: AgentType
      description: Agent type classification for applications.
    AlertType:
      type: string
      enum:
      - llm_threshold_exceeded
      - connection_broken
      - mcp_server_added
      - mcp_server_deleted
      - policy_changed
      - policy_impact
      - admin_role_change
      - break_glass_used
      - llm_budget_exhausted
      - llm_provider_unavailable
      - llm_provider_key_rejected
      - api_key_revoked
      - mcp_server_tooling_changed
      title: AlertType
      description: "A discrete, notification-worthy event. This is what publishers\
        \ emit and what channels\nsubscribe to \u2014 a channel is delivered an alert\
        \ when its subscription set contains that\nalert's type. Severity and category\
        \ are intrinsic to the type (see ``ALERT_TAXONOMY``), so\nthey are never set\
        \ per subscription.\n\nTreat this enum as open: values are added over time,\
        \ and the set your organization may\nactually subscribe to is gated by feature\
        \ flags. Read\n``GET /public/v1/channels/options`` for the live vocabulary\
        \ rather than hardcoding these\nnames \u2014 subscribing to a type your organization\
        \ is not admitted to is silently inert."
    AlertTypeOption:
      properties:
        value:
          type: string
          title: Value
          description: "The alert type \u2014 what to send as a subscription's `alert_type`."
          examples:
          - break_glass_used
        label:
          type: string
          title: Label
          description: Human-readable label for display.
        category:
          type: string
          title: Category
          description: The type's category. Intrinsic to the type, not configurable.
        severity:
          type: string
          title: Severity
          description: The type's severity. Intrinsic to the type, not configurable.
      type: object
      required:
      - value
      - label
      - category
      - severity
      title: AlertTypeOption
      description: One subscribable alert type, plus its intrinsic category and severity.
    AllowListEntryResponse:
      type: object
      required:
      - id
      - org_id
      - pattern
      - pattern_type
      - detection_types
      - reason
      - created_by
      - created_at
      properties:
        created_at:
          type: string
        created_by:
          type: string
        detection_types:
          type: array
          items:
            type: string
        id:
          type: string
        org_id:
          type: string
        pattern:
          type: string
        pattern_type:
          type: string
        reason:
          type: string
    ApiKey:
      type: object
      required:
      - id
      - org_id
      - kind
      - created_by_user_id
      - name
      - key_prefix
      - scopes
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        created_by_user_id:
          type: string
          format: uuid
        disabled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When this key was temporarily disabled. Unlike `revoked_at`
            this is

            reversible: the auth path rejects the key while set, but re-enabling

            (clearing it) restores access without re-issuing the secret.'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        group_name:
          type:
          - string
          - 'null'
          description: 'Optional explicit IdP group binding for this key. NULL means
            no

            explicit group; the key still inherits the assigned user''s IdP groups

            at request time for governance scope matching.'
        id:
          type: string
          format: uuid
        key_prefix:
          type: string
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
          description: Category of credential (BCP-3510). Set at insert, never updated.
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When this key last authenticated a request. `None` means it
            has never

            been used. Updated best-effort and throttled on the auth path (see

            `touch_last_used`), so it is accurate to within `last_used_min_interval`.'
        name:
          type: string
        org_id:
          type: string
          format: uuid
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
        scopes:
          type: array
          items:
            type: string
        user_id:
          type:
          - string
          - 'null'
          format: uuid
    ApiKeyDisabledResponse:
      type: object
      description: "`PATCH /admin/api-keys/{id}` \u2014 echoes the disabled state\
        \ now in effect."
      required:
      - disabled
      properties:
        disabled:
          type: boolean
          description: The key's disabled flag after the update, echoing the request.
    ApiKeyKind:
      type: string
      description: "What category of credential a row is (BCP-3510) \u2014 the first-class\
        \ answer to\n\"is this an ephemeral governed agent-session key?\", which the\
        \ service used\nto get by pattern-matching [`AGENT_SESSION_SCOPE`] inside\
        \ `scopes`.\n\nDistinct from [`ActorKind`], which answers a different question.\
        \ `kind` is\nabout **lifecycle**: who may list it, who may revoke it, and\
        \ whether the\nreaper may delete it. `ActorKind` is about **attribution**:\
        \ whose name goes\non an event. That is why `Machine` here covers both the\
        \ pure service key and\nthe IdP-group-bound key that `ActorKind` keeps apart\
        \ \u2014 the two are listed,\nrevoked and reaped identically, and only the\
        \ audit trail cares which is\nwhich."
      enum:
      - user
      - machine
      - agent_session
    AppType:
      type: string
      enum:
      - regular_web
      - spa
      - native
      - non_interactive
      title: AppType
      description: 'Supported OAuth application types.


        Values mirror Auth0''s ``app_type`` field; the same values are used

        internally for Keycloak (which has no native ``app_type`` concept).'
    Application:
      properties:
        deleted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deleted At
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        application_directory_id:
          type: string
          format: uuid
          title: Application Directory Id
        write_confirmations_required:
          type: boolean
          title: Write Confirmations Required
          default: true
        llm_gateway_enabled:
          type: boolean
          title: Llm Gateway Enabled
          default: false
      type: object
      required:
      - deleted_at
      - id
      - created_at
      - updated_at
      - organization_id
      - application_directory_id
      - write_confirmations_required
      - llm_gateway_enabled
      title: Application
    ApplicationCounts:
      properties:
        all:
          type: integer
          title: All
        internal:
          type: integer
          title: Internal
        external:
          type: integer
          title: External
      type: object
      required:
      - all
      - internal
      - external
      title: ApplicationCounts
    ApplicationDirectoryBase:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        owner_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Name
          description: Responsible team or person that manages the agent.
        owner_contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Contact
          description: Contact information (email, Slack, etc.) for the agent owner.
        organization_id:
