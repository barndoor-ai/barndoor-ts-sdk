        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '403':
          description: Caller lacks a tenant-admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '404':
          description: No such connection configured for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
    put:
      tags:
      - dlp
      summary: Create or update a provider connection
      operationId: upsert_connection
      parameters:
      - name: name
        in: path
        description: Provider name, e.g. `presidio`
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertConnectionRequest'
        required: true
      responses:
        '200':
          description: The stored connection, without secret material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnectionResponse'
        '400':
          description: Provider mismatch, or invalid connection configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '403':
          description: Caller lacks a tenant-admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '500':
          description: Secret material could not be persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '503':
          description: OpenBao is not configured, so secrets cannot be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
    delete:
      tags:
      - dlp
      summary: Delete a provider connection and its stored secrets
      operationId: delete_provider_connection
      parameters:
      - name: name
        in: path
        description: Provider name, e.g. `presidio`
        required: true
        schema:
          type: string
      responses:
        '204':
          description: "Deleted. Also returned when no such connection exists \u2014\
            \ the handler is idempotent and does not distinguish the two. Removing\
            \ a connection a detection engine still references succeeds; nothing enforces\
            \ that reference"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '403':
          description: Caller lacks a tenant-admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
        '500':
          description: 'The connection store failed. Note that removing the stored
            secrets is best-effort: a failure there is logged and the row is still
            deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DlpErrorResponse'
