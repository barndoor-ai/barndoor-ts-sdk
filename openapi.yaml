              requested model alias (`request.model`) equals this value. Mutually

              exclusive with the other two `target_*` fields.'
          target_provider_id:
            type:
            - string
            - 'null'
            format: uuid
            description: 'BCP-2813 Target dimension: when set, the budget only fires
