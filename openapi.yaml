        - traffic_type
        - enabled
        properties:
          action_on_exhaust:
            $ref: '#/components/schemas/BudgetAction'
          alert_thresholds:
            type: array
            items:
              type: integer
              format: int32
          cost_limit:
            type:
            - number
            - 'null'
            format: double
            description: 'Optional spending cap in the configured currency.

              When set, the budget is enforced on estimated cost in addition to tokens.'
          created_at:
            type:
            - string
            - 'null'
            format: date-time
            description: 'When the budget was created. Populated on the admin API
              path (where it

              is surfaced in the dashboard); left `None` on the hot enforcement path

              and in fixtures, which don''t need it. `#[serde(default)]` keeps older

              payloads without the field deserializing cleanly.'
          currency:
            type: string
            description: ISO 4217 currency code (e.g. "USD"). Defaults to "USD".
          enabled:
            type: boolean
          id:
            type: string
            format: uuid
          member_of_group:
            type:
            - string
            - 'null'
            description: "BCP-3814 membership filter: when set, this budget only applies\
              \ to\nrequesters whose IdP group membership includes this group name.\n\
              \nOnly meaningful on a broad user-scoped budget (`scope_type == User`\n\
              with `scope_id` and `scope_value` both `None`), where the counter\n\
              qualifier already resolves to the requesting user's id \u2014 so one\
              \ budget\nrow gives every *member of the group* their own independent\
              \ allowance,\nand a user joining the group is enforced on their next\
              \ request with no\nadmin action. DB-enforced by\n`token_budgets_member_of_group_requires_broad_user`\
              \ (V65, tightened to\nexclude `scope_value` by V67).\n\n`None` \u21D2\
              \ the budget applies org-wide (the pre-BCP-3814 behaviour).\nContrast\
              \ with a `ScopeType::Group` budget, which keys its counter by\nthe group\
              \ name and so *pools* one allowance across all members."
          name:
            type: string
          org_id:
            type: string
            format: uuid
          period:
