      - $ref: '#/components/schemas/ChangeAttribution'
      description: "An admin-API response for an entity whose core type lives in\n\
        `ai_governance` and so cannot carry portal-only columns.\n\n`TokenBudget`\
        \ and `RateLimitPolicy` are read by the enforcement path on\nevery request;\
        \ hanging five display-only fields off them would put portal\nconcerns in\
        \ the hot path's type and force every governance consumer to\ncarry them.\
        \ Wrapping instead keeps the enforcement reads\n(`get_enabled_by_org` and\
        \ friends) returning the bare governance type,\nwhile the admin reads return\
        \ this.\n\nBoth halves are `#[serde(flatten)]`, so the wire shape stays the\
        \ flat\nobject the portal already consumes \u2014 same choice `AdminModelPricing`\
        \ makes."
    WithAttribution_RateLimitPolicy:
      allOf:
      - type: object
        required:
        - id
        - org_id
        - name
        - scope_type
        - traffic_type
        - enabled
        properties:
          enabled:
            type: boolean
          id:
            type: string
            format: uuid
          member_of_group:
            type:
            - string
            - 'null'
            description: "BCP-3814 membership filter: when set, this policy only applies\
              \ to\nrequesters whose IdP group membership includes this group name.\n\
              \nOnly meaningful on a broad user-scoped policy (`scope_type == User`\n\
              with `scope_id` and `scope_value` both `None`), where the counter key\
              \ resolves to\nthe requesting user's id \u2014 so one policy row gives\
              \ every *member of\nthe group* their own RPM/TPM allowance, and a user\
              \ joining the group\nis limited on their next request with no admin\
              \ action. DB-enforced by\n`rate_limit_policies_member_of_group_requires_broad_user`\
              \ (V66, tightened\nto exclude `scope_value` by V67).\n\n`None` \u21D2\
              \ org-wide (the pre-BCP-3814 behaviour). Contrast with a\n`ScopeType::Group`\
              \ policy, which keys its counter by the group name\nand so *pools* one\
              \ limit across all members."
          name:
            type: string
          org_id:
            type: string
            format: uuid
          requests_per_minute:
            type:
            - integer
            - 'null'
            format: int32
          scope_id:
            type:
            - string
            - 'null'
            format: uuid
          scope_type:
            $ref: '#/components/schemas/ScopeType'
          scope_value:
            type:
            - string
            - 'null'
          target_mcp_server_id:
            type:
            - string
            - 'null'
            format: uuid
            description: "BCP-4056 Target dimension: when set, the policy only fires\
              \ on requests\nrouted to this MCP server. The MCP-traffic counterpart\
              \ of\n`target_provider_id`, and mutually exclusive with all three LLM\
              \ target\ncolumns (DB-enforced by\n`rate_limit_policies_mcp_target_exclusive_check`)\
              \ \u2014 no single request\ncarries both an MCP server and an LLM route,\
              \ so a row naming both\ncould never match.\n\nDistinct from a `ScopeType::McpServer`\
              \ policy, which puts the server on\nthe *identity* axis and so cannot\
              \ be combined with a user or group.\nUnlike the other two object-shaped\
              \ scopes, that one does work \u2014 it\nmoves here for consistency and\
              \ to make \"this user's rpm on this\nserver\" expressible, not to fix\
              \ a defect."
          target_model_alias:
            type:
            - string
            - 'null'
            description: 'BCP-4056 Target dimension: when set, the policy only fires
              when the

              requested model alias (`request.model`) equals this value. Mutually

              exclusive with the other two LLM `target_*` fields.


              Together with `target_provider_id`/`target_upstream_model` this

              replaces `ScopeType::Model`, which could never match anything:

              `GovernanceIdentity::scope_keys()` deliberately emits no `(Model, _)`

              pair, so a model-scoped policy rendered as Enabled while enforcing

              nothing.'
          target_provider_id:
            type:
            - string
            - 'null'
            format: uuid
            description: "BCP-4056 Target dimension: when set, the policy only fires\
              \ on routes\nwhose provider id equals this value. May be combined with\n\
              `target_upstream_model` to limit a single model on this provider;\n\
              mutually exclusive with `target_model_alias` (DB-enforced by\n`rate_limit_policies_alias_target_exclusive_check`).\n\
              \nThis replaces `ScopeType::LlmProvider` as the way to express \"limit\n\
              this provider\". That scope never worked on the check path \u2014 the\n\
              gateway middleware builds its identity with no `llm_provider_id`, so\n\
              no `(LlmProvider, _)` scope key exists to match against, while the\n\
              post-response record path *does* carry one and wrote usage to a\ncounter\
              \ nothing read."
          target_upstream_model:
            type:
            - string
            - 'null'
            description: "BCP-4056 Target dimension refining `target_provider_id`:\
              \ when set,\nthe policy only fires on routes whose resolved upstream\
              \ model name\nequals this value (string match). Always set alongside\
              \ a provider\n(V74 CHECK-enforced) \u2014 a bare upstream name would\
              \ string every\nprovider serving that model into one limit."
          tokens_per_minute:
            type:
            - integer
            - 'null'
            format: int32
          traffic_type:
            $ref: '#/components/schemas/TrafficType'
      - $ref: '#/components/schemas/ChangeAttribution'
      description: "An admin-API response for an entity whose core type lives in\n\
        `ai_governance` and so cannot carry portal-only columns.\n\n`TokenBudget`\
        \ and `RateLimitPolicy` are read by the enforcement path on\nevery request;\
        \ hanging five display-only fields off them would put portal\nconcerns in\
        \ the hot path's type and force every governance consumer to\ncarry them.\
        \ Wrapping instead keeps the enforcement reads\n(`get_enabled_by_org` and\
        \ friends) returning the bare governance type,\nwhile the admin reads return\
        \ this.\n\nBoth halves are `#[serde(flatten)]`, so the wire shape stays the\
        \ flat\nobject the portal already consumes \u2014 same choice `AdminModelPricing`\
        \ makes."
    WithAttribution_TokenBudget:
      allOf:
      - type: object
        required:
        - id
        - org_id
        - name
        - scope_type
        - period
        - token_limit
        - alert_thresholds
