            `None` (the default) lets `model_mappings.create` write the platform

            default (`STREAM_IDLE_TIMEOUT_DEFAULT_SECS`) at the route tier. The

            range is fixed platform policy

            (`STREAM_IDLE_TIMEOUT_MIN_SECS..=STREAM_IDLE_TIMEOUT_MAX_SECS`); see

            [`crate::proxy::timeouts`].'
        upstream_model:
          type: string
