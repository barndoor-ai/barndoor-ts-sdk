  /api/policy/v2/policies/{policy_id}:
    get:
      tags:
      - policy
      summary: Get Policy
      operationId: get_policy
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      responses:
        '200':
          description: Successful Response
          content:
