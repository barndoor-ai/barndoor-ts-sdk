          title: Match
          description: "Matcher tree. Either a single expression `{\"expr\": \"...\"\
            }` or a boolean combinator `{\"all\"|\"any\"|\"none\": {\"of\": [<matcher>,\
            \ ...]}}`, which nest arbitrarily. The variant is selected by WHICH KEY\
            \ IS PRESENT \u2014 there is no separate discriminator field. Example:\
            \ {\"all\": {\"of\": [{\"expr\": \"P.attr.department == 'Engineering'\"\
            }, {\"expr\": \"R.attr.env != 'prod'\"}]}}"
