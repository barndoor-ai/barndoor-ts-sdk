    LlmGatewayAwsRoleConfigResponse:
      type: object
      description: 'Whether Barndoor''s own AWS principal is configured for role-assumption

        trust policies.


        Named with the service prefix because dlp-service publishes a type of the

        same shape under the unprefixed name, and the merged document has ONE global

        component namespace. The generator fails closed on two services defining the

        same referenced component differently, which is how this was caught. Making

        the two byte-identical instead would silently couple two services'' schemas

        and turn any later divergence into a hard failure of the whole spec.'
      required:
      - configured
      properties:
        configured:
          type: boolean
          description: True when Barndoor has a principal ARN to put in a customer
            trust policy.
        principal_arn:
          type:
          - string
          - 'null'
          description: The ARN customers name as the trusted principal; null when
            unconfigured.
    LlmGatewayAwsTrustInfoResponse:
      type: object
      description: The pair a customer needs to write an `aws_role` trust policy.
      required:
      - principal_arn
      - external_id
      properties:
        external_id:
          type: string
          description: The per-connection external id, to require in the trust condition.
        principal_arn:
          type: string
          description: Barndoor's principal ARN, to trust in the customer's role.
    LongContextTier:
      type: object
      description: "The alternate rate set a pricing row switches to once a request's\
        \ prompt\nreaches `threshold_prompt_tokens` (BCP-3904).\n\nCrossing the threshold\
        \ re-rates the **whole** request, not just the tokens\npast it \u2014 that\
        \ is how xAI, OpenAI and Azure all publish it, and it is why\nthis is a rate\
        \ switch rather than a marginal bracket.\n\nNote the asymmetry that makes\
        \ this easy to get wrong: the gate is measured\non the *prompt*, but the surcharge\
        \ applies to output tokens too. The gate\nquantity and the billed quantities\
        \ are different numbers."
      required:
      - threshold_prompt_tokens
      - input_cost_per_million_tokens
      - output_cost_per_million_tokens
      properties:
        cache_read_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
          description: "`None` \u21D2 bill cache reads at this tier's input rate,\
            \ mirroring the\nbase-rate fallback rather than falling back to the *base*\
            \ cache rate\n(which would price a long-context cache read below its own\
            \ tier)."
        cache_write_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
          description: "`None` \u21D2 same fallback as `cache_read_cost_per_million_tokens`."
        input_cost_per_million_tokens:
          type: number
          format: double
        output_cost_per_million_tokens:
          type: number
          format: double
        threshold_prompt_tokens:
          type: integer
          format: int64
          description: "Total prompt tokens at or above which this tier replaces the\
            \ base\nrates. Inclusive \u2014 see [`ModelPricing::rates_for_prompt`]."
    LongContextTierEntry:
      type: object
      description: "The tier half of a [`DefaultPricingEntry`], flattened out of the\
        \ five\nnullable columns into one optional object so the API shape says\n\"\
        either a whole tier or none\" \u2014 which is what the DB constraint enforces."
      required:
      - threshold_prompt_tokens
      - input_cost_per_million_tokens
      - output_cost_per_million_tokens
      properties:
        cache_read_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
        cache_write_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
        input_cost_per_million_tokens:
          type: number
          format: double
        output_cost_per_million_tokens:
          type: number
          format: double
        threshold_prompt_tokens:
          type: integer
          format: int64
    LongContextTierRequest:
      type: object
      description: 'The long-context surcharge on a create/update request.


        One nested object rather than five sibling fields so a partial tier is

        awkward to express in the first place, and so the wire shape matches both

        the provider YAML''s `long_context:` block and the `long_context` object the

        defaults listing returns.'
      required:
      - threshold_prompt_tokens
      - input_cost_per_million_tokens
      - output_cost_per_million_tokens
      properties:
        cache_read_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
          description: Omit to bill long-context cache reads at this tier's input
            rate.
        cache_write_cost_per_million_tokens:
          type:
          - number
          - 'null'
          format: double
        input_cost_per_million_tokens:
          type: number
          format: double
        output_cost_per_million_tokens:
          type: number
          format: double
        threshold_prompt_tokens:
          type: integer
          format: int64
          description: 'Total prompt tokens (non-cached input + cache-read + cache-creation)

            at or above which the tier''s rates replace the base rates for the

            whole request.'
